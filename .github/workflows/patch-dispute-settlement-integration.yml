name: Apply dispute settlement integration patch

on:
  push:
    branches:
      - phase3/dispute-balance-settlement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/dispute-balance-settlement
          fetch-depth: 0
      - name: Apply deterministic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route_path = Path('src/app/api/stripe/webhook/route.ts')
          route = route_path.read_text()

          old = '''import {
            deriveFinancialOrderStatus,
            mergeStripeDisputeMeta,
            type StripeDisputeEventType,
          } from "@/lib/stripe-dispute-integrity";'''
          new = old + '''
          import {
            mergeStripeDisputeSettlementMeta,
            validateStripeDisputeSettlementEvidence,
            type StripeDisputeSettlementEvidence,
            type StripeDisputeSettlementEventType,
            type StripeDisputeSettlementKind,
          } from "@/lib/stripe-dispute-settlement";'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          anchor = '''async function reconcilePaymentFee(
            tx: Prisma.TransactionClient,
            evidence: StripeFeeEvidence,
            eventId: string,
          ) {'''
          prep = '''async function prepareDisputeSettlementEvidence(
            event: StripeEvent,
          ): Promise<StripeDisputeSettlementEvidence | null> {
            if (
              event.type !== "charge.dispute.funds_withdrawn" &&
              event.type !== "charge.dispute.funds_reinstated"
            ) {
              return null;
            }

            const object = event.data.object;
            const values = Array.isArray(object.balance_transactions)
              ? object.balance_transactions
              : [];
            if (values.length === 0) {
              throw new Error("WEBHOOK_DISPUTE_SETTLEMENT_BALANCE_TRANSACTION_MISSING");
            }

            const kind: StripeDisputeSettlementKind =
              event.type === "charge.dispute.funds_withdrawn"
                ? "funds_withdrawn"
                : "funds_reinstated";
            let evidence: StripeDisputeSettlementEvidence | null = null;

            for (const value of values) {
              const transactionId = objectId(value);
              if (!transactionId) continue;
              const transaction = await retrieveStripeBalanceTransaction(transactionId);
              const signMatches =
                kind === "funds_withdrawn" ? transaction.amount < 0 : transaction.amount > 0;
              if (!signMatches) continue;

              const validated = validateStripeDisputeSettlementEvidence({
                dispute: object,
                balanceTransaction: transaction,
                kind,
              });
              if (!validated.ok) throw new Error(validated.reason);
              if (
                evidence &&
                evidence.balanceTransactionId !== validated.evidence.balanceTransactionId
              ) {
                throw new Error("WEBHOOK_DISPUTE_SETTLEMENT_BALANCE_TRANSACTION_AMBIGUOUS");
              }
              evidence = validated.evidence;
            }

            if (!evidence) {
              throw new Error("WEBHOOK_DISPUTE_SETTLEMENT_MATCHING_TRANSACTION_MISSING");
            }
            return evidence;
          }

          ''' + anchor
          assert route.count(anchor) == 1
          route = route.replace(anchor, prep)

          old = '''async function reconcileDispute(
            tx: Prisma.TransactionClient,
            event: StripeEvent,
          ) {'''
          new = '''async function reconcileDispute(
            tx: Prisma.TransactionClient,
            event: StripeEvent,
            settlementEvidence: StripeDisputeSettlementEvidence | null,
          ) {'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          old = '''  if (!merged.ok) throw new Error(merged.reason);

            if (!merged.stale) {
              const paymentUpdated = await tx.payment.updateMany({
                where: { id: payment.id, updatedAt: payment.updatedAt },
                data: { meta: merged.meta },
              });'''
          new = '''  if (!merged.ok) throw new Error(merged.reason);

            let nextPaymentMeta = merged.meta;
            if (settlementEvidence) {
              const settlementMerged = mergeStripeDisputeSettlementMeta({
                currentMeta: nextPaymentMeta,
                evidence: settlementEvidence,
                eventId: event.id,
                eventType: event.type as StripeDisputeSettlementEventType,
                eventCreated,
                reconciledAt: new Date().toISOString(),
              });
              if (!settlementMerged.ok) throw new Error(settlementMerged.reason);
              nextPaymentMeta = settlementMerged.meta;
            }

            if (!merged.stale || settlementEvidence) {
              const paymentUpdated = await tx.payment.updateMany({
                where: { id: payment.id, updatedAt: payment.updatedAt },
                data: { meta: nextPaymentMeta },
              });'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          old = '  const financial = await deriveOrderFinancialStatus(tx, order, merged.meta);'
          assert route.count(old) == 1
          route = route.replace(old, '  const financial = await deriveOrderFinancialStatus(tx, order, nextPaymentMeta);')

          old = '''async function processStripeEvent(
            tx: Prisma.TransactionClient,
            event: StripeEvent,
            feeEvidence: StripeFeeEvidence | null,
            refundFinancialEvidence: RefundFinancialEvidence[],
          ) {'''
          new = '''async function processStripeEvent(
            tx: Prisma.TransactionClient,
            event: StripeEvent,
            feeEvidence: StripeFeeEvidence | null,
            refundFinancialEvidence: RefundFinancialEvidence[],
            disputeSettlementEvidence: StripeDisputeSettlementEvidence | null,
          ) {'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          old = '''    case "charge.dispute.created":
              case "charge.dispute.updated":
              case "charge.dispute.closed":
                orderId = await reconcileDispute(tx, event);
                break;'''
          new = '''    case "charge.dispute.created":
              case "charge.dispute.updated":
              case "charge.dispute.closed":
              case "charge.dispute.funds_withdrawn":
              case "charge.dispute.funds_reinstated":
                orderId = await reconcileDispute(tx, event, disputeSettlementEvidence);
                break;'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          old = '''    const feeEvidence = await prepareStripeFeeEvidence(event);
              const refundFinancialEvidence = await prepareRefundFinancialEvidence(event);
              const result = await prisma.$transaction(async (tx) => {'''
          new = '''    const feeEvidence = await prepareStripeFeeEvidence(event);
              const refundFinancialEvidence = await prepareRefundFinancialEvidence(event);
              const disputeSettlementEvidence = await prepareDisputeSettlementEvidence(event);
              const result = await prisma.$transaction(async (tx) => {'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          old = '''        event,
                  feeEvidence,
                  refundFinancialEvidence,
                );'''
          new = '''        event,
                  feeEvidence,
                  refundFinancialEvidence,
                  disputeSettlementEvidence,
                );'''
          assert route.count(old) == 1
          route = route.replace(old, new)

          route_path.write_text(route)

          integrity_path = Path('src/lib/stripe-dispute-integrity.ts')
          integrity = integrity_path.read_text()
          old = '''export const STRIPE_DISPUTE_EVENT_TYPES = [
            "charge.dispute.created",
            "charge.dispute.updated",
            "charge.dispute.closed",
          ] as const;'''
          new = '''export const STRIPE_DISPUTE_EVENT_TYPES = [
            "charge.dispute.created",
            "charge.dispute.updated",
            "charge.dispute.closed",
            "charge.dispute.funds_withdrawn",
            "charge.dispute.funds_reinstated",
          ] as const;'''
          assert integrity.count(old) == 1
          integrity_path.write_text(integrity.replace(old, new))
          PY

          rm .github/workflows/patch-dispute-settlement-integration.yml
          git config user.name "DealForge Gatekeeper"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/stripe/webhook/route.ts src/lib/stripe-dispute-integrity.ts .github/workflows/patch-dispute-settlement-integration.yml
          git diff --cached --check
          git commit -m "Phase 3: wire Stripe dispute settlement events"
          git push origin HEAD:phase3/dispute-balance-settlement
