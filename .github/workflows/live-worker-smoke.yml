name: DealForge Live Worker Smoke

on:
  push:
    branches:
      - migration/cloudflare-workers
    paths:
      - .github/workflows/live-worker-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/live-worker-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://dealforge.blahtblclthpt99.workers.dev
      PRODUCTION_URL: https://www.deal-forge.sale
      APEX_URL: https://deal-forge.sale
      PRODUCT_ID: cmrp6aaeu06kgtk3shzktm0h9
      PRODUCT_SLUG: teling-100-pcs-rainbow-colored-pencils-multicolored-7-in-1-pencils-for-kids-blac-b0bpxv8vky
      PRODUCT_ASIN: B0BPXV8VKY
      IMAGE_URL: https://m.media-amazon.com/images/I/71ye0K8jt7L._AC_SL1500_.jpg
    steps:
      - name: Probe live routes
        shell: bash
        run: |
          set -u
          failed=0
          for path in / /categories /deals /search /login /register /dashboard /admin; do
            body="/tmp/body-$(echo "$path" | tr '/?' '__')"
            code=$(curl --silent --show-error --location --max-time 30 --output "$body" --write-out '%{http_code}' "$BASE_URL$path" || echo 000)
            echo "$path -> $code"
            if [[ "$path" == "/" ]]; then
              if grep -qi 'Database not connected' "$body"; then
                echo 'HOME_SETUP_BANNER=present'
                failed=1
              else
                echo 'HOME_SETUP_BANNER=absent'
              fi
            fi
            if [[ "$code" -ge 500 || "$code" == "000" ]]; then
              echo "BODY_PREVIEW $path:"
              head -c 1200 "$body" || true
              echo
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify product and affiliate redirect
        shell: bash
        run: |
          set -euo pipefail

          product_code=$(curl --silent --show-error --max-time 30 --output /tmp/product.html --write-out '%{http_code}' "$BASE_URL/product/$PRODUCT_SLUG")
          echo "product detail -> $product_code"
          [[ "$product_code" == "200" ]]

          go_code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --dump-header /tmp/go.headers --output /tmp/go.body --write-out '%{http_code}' "$BASE_URL/go/$PRODUCT_ID" || true)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' /tmp/go.headers | tail -n 1)
          echo "affiliate redirect -> $go_code"
          echo "affiliate host/location -> $location"
          [[ "$go_code" == "302" ]]
          [[ "$location" == https://amazon.com/* || "$location" == https://*.amazon.com/* ]]
          [[ "$location" == *"/dp/$PRODUCT_ASIN"* ]]
          [[ "$location" == *"tag=titanfieldos-20"* ]]

      - name: Verify image proxy allowlist
        shell: bash
        run: |
          set -euo pipefail

          image_code=$(curl --silent --show-error --max-time 30 --get --data-urlencode "u=$IMAGE_URL" --dump-header /tmp/image.headers --output /tmp/image.bin --write-out '%{http_code}' "$BASE_URL/api/img")
          image_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' /tmp/image.headers | tail -n 1)
          echo "allowed image -> $image_code ($image_type)"
          [[ "$image_code" == "200" ]]
          [[ "$image_type" == image/* ]]

          blocked_code=$(curl --silent --show-error --max-time 30 --get --data-urlencode "u=https://example.com/not-allowed.png" --output /tmp/blocked-image.txt --write-out '%{http_code}' "$BASE_URL/api/img")
          echo "blocked image host -> $blocked_code"
          [[ "$blocked_code" == "400" ]]

      - name: Verify unauthenticated access controls
        shell: bash
        run: |
          set -euo pipefail

          check_redirect() {
            local path="$1"
            local expected="$2"
            local key
            key=$(echo "$path" | tr '/' '_')
            local headers="/tmp/${key}.headers"
            local code
            code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$BASE_URL$path" || true)
            local location
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tail -n 1)
            echo "$path unauthenticated -> $code $location"
            [[ "$code" =~ ^30[2378]$ ]]
            [[ "$location" == *"$expected"* ]]
          }

          check_redirect "/dashboard" "/login?next=/dashboard"
          check_redirect "/admin" "/login?next=/admin"

      - name: Verify temporary diagnostics are removed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --output /tmp/diagnostics-removed.txt --write-out '%{http_code}' "$BASE_URL/api/runtime-diagnostics" || true)
          echo "runtime diagnostics endpoint -> $code"
          [[ "$code" == "404" ]]

      - name: Wait for custom domains and certify production URL
        shell: bash
        run: |
          set -euo pipefail

          nameservers=$(dig +short NS deal-forge.sale | tr '\n' ' ')
          echo "authoritative nameservers -> $nameservers"
          if [[ "$nameservers" == *"vercel-dns.com"* ]]; then
            echo "::error::deal-forge.sale is still delegated to Vercel DNS. Change the registrar nameservers to the Cloudflare-assigned pair before custom-domain certification."
            exit 1
          fi
          if [[ "$nameservers" != *"ns.cloudflare.com"* ]]; then
            echo "::error::deal-forge.sale is not yet delegated to Cloudflare nameservers."
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 30); do
            www_code=$(curl --silent --show-error --location --max-time 20 --output /tmp/www-home.html --write-out '%{http_code}' "$PRODUCTION_URL/" || echo 000)
            apex_code=$(curl --silent --show-error --location --max-time 20 --output /tmp/apex-home.html --write-out '%{http_code}' "$APEX_URL/" || echo 000)
            echo "custom domains attempt $attempt -> www=$www_code apex=$apex_code"
            if [[ "$www_code" == "200" && "$apex_code" == "200" ]]; then
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == "1" ]]
          ! grep -qi 'Database not connected' /tmp/www-home.html
          ! grep -qi 'Database not connected' /tmp/apex-home.html

          for path in /categories /deals /search /login /register; do
            code=$(curl --silent --show-error --location --max-time 30 --output /tmp/custom-route.html --write-out '%{http_code}' "$PRODUCTION_URL$path" || echo 000)
            echo "production $path -> $code"
            [[ "$code" == "200" ]]
          done

          product_code=$(curl --silent --show-error --max-time 30 --output /tmp/custom-product.html --write-out '%{http_code}' "$PRODUCTION_URL/product/$PRODUCT_SLUG")
          echo "production product detail -> $product_code"
          [[ "$product_code" == "200" ]]

          go_code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --dump-header /tmp/custom-go.headers --output /tmp/custom-go.body --write-out '%{http_code}' "$PRODUCTION_URL/go/$PRODUCT_ID" || true)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' /tmp/custom-go.headers | tail -n 1)
          echo "production affiliate redirect -> $go_code $location"
          [[ "$go_code" == "302" ]]
          [[ "$location" == https://amazon.com/* || "$location" == https://*.amazon.com/* ]]
          [[ "$location" == *"/dp/$PRODUCT_ASIN"* ]]
          [[ "$location" == *"tag=titanfieldos-20"* ]]

          image_code=$(curl --silent --show-error --max-time 30 --get --data-urlencode "u=$IMAGE_URL" --dump-header /tmp/custom-image.headers --output /tmp/custom-image.bin --write-out '%{http_code}' "$PRODUCTION_URL/api/img")
          image_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' /tmp/custom-image.headers | tail -n 1)
          echo "production image proxy -> $image_code ($image_type)"
          [[ "$image_code" == "200" ]]
          [[ "$image_type" == image/* ]]

          for path in /dashboard /admin; do
            headers="/tmp/custom$(echo "$path" | tr '/' '_').headers"
            code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL$path" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tail -n 1)
            echo "production $path unauthenticated -> $code $location"
            [[ "$code" =~ ^30[2378]$ ]]
            [[ "$location" == *"/login"* ]]
          done
