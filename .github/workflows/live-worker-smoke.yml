name: DealForge Live Worker Smoke

on:
  push:
    branches:
      - migration/cloudflare-workers
    paths:
      - .github/workflows/live-worker-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/live-worker-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://dealforge.blahtblclthpt99.workers.dev
    steps:
      - name: Wait for runtime diagnostics deployment
        shell: bash
        run: |
          set -euo pipefail
          url="$BASE_URL/api/runtime-diagnostics"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/runtime-diagnostics.json --write-out '%{http_code}' "$url" || echo 000)
            echo "runtime diagnostics attempt $attempt -> $code"
            if [[ "$code" == "200" ]]; then
              cat /tmp/runtime-diagnostics.json
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Runtime diagnostics endpoint did not become available in time"
          exit 1

      - name: Probe live routes
        shell: bash
        run: |
          set -u
          failed=0
          for path in / /categories /deals /search /login /register /dashboard /admin; do
            body="/tmp/body-$(echo "$path" | tr '/?' '__')"
            code=$(curl --silent --show-error --location --max-time 30 --output "$body" --write-out '%{http_code}' "$BASE_URL$path" || echo 000)
            echo "$path -> $code"
            if [[ "$path" == "/" ]]; then
              if grep -qi 'Database not connected' "$body"; then
                echo 'HOME_SETUP_BANNER=present'
                failed=1
              else
                echo 'HOME_SETUP_BANNER=absent'
              fi
            fi
            if [[ "$code" -ge 500 || "$code" == "000" ]]; then
              echo "BODY_PREVIEW $path:"
              head -c 1200 "$body" || true
              echo
              failed=1
            fi
          done
          exit "$failed"
