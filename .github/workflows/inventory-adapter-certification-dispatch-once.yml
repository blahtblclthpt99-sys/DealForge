name: Final Inventory Adapter Certification Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-adapter-certification-dispatch-once.yml'

permissions:
  actions: write
  contents: read
  statuses: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for exact revision to be live on Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            deploy=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[] | select(.context=="cloudflare-production-deploy")][0].state // "missing"')
            echo "production deploy attempt ${attempt}: ${deploy}"

            if [[ "$deploy" == 'failure' || "$deploy" == 'error' ]]; then
              echo '::error::Exact revision failed Cloudflare deployment; refusing final adapter certification.'
              exit 1
            fi
            if [[ "$deploy" == 'success' ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "$ready" != '1' ]]; then
            echo '::error::Exact revision did not reach successful Cloudflare deployment.'
            exit 1
          fi

      - name: Dispatch permanent manual adapter certification workflow
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main moved from ${GITHUB_SHA} to ${main_sha}; refusing to dispatch against a different revision."
            exit 1
          fi

          gh workflow run inventory-adapter-certification.yml --repo "$GITHUB_REPOSITORY" --ref main

          post_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          if [[ "$post_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main moved during dispatch from ${GITHUB_SHA} to ${post_sha}; certification workflow will independently require its own exact deploy proof."
            exit 1
          fi

          echo "Dispatched final inventory adapter certification for deployed main revision ${GITHUB_SHA}."
