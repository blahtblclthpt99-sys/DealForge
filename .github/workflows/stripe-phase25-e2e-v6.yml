name: Stripe Phase 2.5 Hosted Checkout Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-phase25-e2e-v6.yml'
      - 'docs/stripe-phase25-certification-2026-08-24.md'
      - 'src/lib/stripe-commerce.ts'
      - 'src/lib/commerce-gate.ts'
      - 'src/lib/commercialization.ts'
      - 'src/app/api/checkout/route.ts'
      - 'src/app/api/stripe/webhook/route.ts'
      - 'src/app/api/admin/refunds/route.ts'
      - 'src/app/api/admin/product-engine/route.ts'
      - 'tests/stripe-commerce.test.ts'
      - 'tests/commerce-gate.test.ts'
      - 'tests/commercialization.test.ts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: stripe-phase25-hosted-checkout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkout-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealforge
          POSTGRES_PASSWORD: dealforge
          POSTGRES_DB: dealforge_phase25_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealforge -d dealforge_phase25_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql://dealforge:dealforge@localhost:5432/dealforge_phase25_ci?schema=public
      AUTH_SECRET: phase25-ci-only-auth-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PRODUCT_ENGINE_OWNER_EMAIL: owner@example.test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CERT_EMAIL: phase25-hosted-gate-20260825@example.com
      CHECKOUT_KEY: phase25-hosted-gate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate database schemas and migration chain
        run: |
          set -euo pipefail
          npm run prisma:validate
          npx prisma migrate deploy --schema=prisma/schema.postgres.prisma

      - name: Prepare isolated application test database
        env:
          DATABASE_URL: file:./phase25-ci-test.db
        run: |
          set -euo pipefail
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma --force-reset --skip-generate

      - name: Run Stripe and commerce regression suite
        env:
          DATABASE_URL: file:./phase25-ci-test.db
        run: |
          set -euo pipefail
          npm test
          npx tsx --test tests/stripe-commerce.test.ts tests/commerce-gate.test.ts tests/commercialization.test.ts

      - name: Wait for exact production revision
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[] | select(.context == "cloudflare-production-deploy")][0].state // "pending"')
            echo "production deploy status attempt ${attempt}: ${state}"
            if [[ "$state" == 'success' ]]; then
              exit 0
            fi
            if [[ "$state" == 'failure' || "$state" == 'error' ]]; then
              echo '::error::Exact production revision failed Cloudflare deployment.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for exact production revision.'
          exit 1

      - name: Verify live production runtime gate
        run: |
          set -euo pipefail
          base='https://www.deal-forge.sale'

          health_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/phase25-health -w '%{http_code}' "$base/api/health")
          db_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/phase25-health','utf8'));process.stdout.write(String(j.database||'unknown'))}catch{process.stdout.write('invalid_response')}")
          [[ "$health_code" == '200' && "$db_state" == 'ok' ]] || { echo "::error::Production health/database gate failed (${health_code}/${db_state})"; exit 1; }

          cert_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/phase25-cert-route -w '%{http_code}' "$base/stripe-certification")
          [[ "$cert_code" == '200' ]] || { echo "::error::Production certification route failed (${cert_code})"; exit 1; }

          webhook_code=$(curl -sS -o /tmp/phase25-webhook -w '%{http_code}' \
            -X POST "$base/api/stripe/webhook" \
            -H 'content-type: application/json' \
            -H 'stripe-signature: t=1,v1=deadbeef' \
            --data '{}' || true)
          webhook_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/phase25-webhook','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
          [[ "$webhook_code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]] || { echo "::error::Production webhook verification gate failed (${webhook_code}/${webhook_error})"; exit 1; }

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-runtime-gate \
            -f description='Production health, database, certification route, and webhook verification passed'

      - name: Provision guarded production certification fixtures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CERTIFICATION_CATALOG_ONLY: "true"
          CERTIFICATION_FIXTURE_WRITE: "true"
        run: |
          set -euo pipefail
          [[ -n "$DATABASE_URL" ]] || { echo '::error::Production DATABASE_URL is unavailable.'; exit 1; }
          [[ "$STRIPE_SECRET_KEY" == sk_test_* ]] || { echo '::error::Certification fixture install requires the certified Stripe test key.'; exit 1; }
          npx prisma generate --schema=prisma/schema.postgres.prisma
          npx tsx scripts/install-certification-catalog.ts

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-cert-fixtures \
            -f description='Guarded production certification fixtures installed or refreshed'

      - name: Create live test-mode Checkout Session
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o checkout.json -w '%{http_code}' \
            -X POST 'https://www.deal-forge.sale/api/checkout' \
            -H 'content-type: application/json' \
            --data "{\"checkoutKey\":\"${CHECKOUT_KEY}\",\"email\":\"${CERT_EMAIL}\",\"items\":[{\"productId\":\"cert_catalog_home_main_20260825\",\"quantity\":1}]}"
          )

          state=failure
          [[ "$code" == 201 ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="stripe-phase25-http-${code}" \
            -f description="Checkout HTTP ${code}"

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('checkout.json', 'utf8'));
          if (!body.checkoutUrl || !body.orderNumber) {
            throw new Error(body.error || 'checkout response invalid');
          }
          if (!body.checkoutUrl.startsWith('https://checkout.stripe.com/')) {
            throw new Error('checkout URL is not Stripe-hosted');
          }
          console.log(`Created ${body.orderNumber}`);
          NODE

          [[ "$code" == 201 ]]
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-checkout-create \
            -f description='Fresh allowlisted Stripe-hosted test Checkout created'

      - name: Verify recorded financial certification
        run: |
          set -euo pipefail
          report='docs/stripe-phase25-certification-2026-08-24.md'
          test -f "$report"
          grep -Fq 'Status: **CERTIFIED**' "$report"
          grep -Fq 'Mode: **Stripe test mode only**' "$report"
          grep -Fq 'pending_payment -> paid' "$report"
          grep -Fq 'paid -> refunded' "$report"
          grep -Fq 'pi_3U84CoRFopwBpZeP1BRJxV6X' "$report"
          grep -Fq 're_3U84CoRFopwBpZeP1TtbLyyy' "$report"

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-financial-certification \
            -f description='Certified sandbox payment, webhook ledger, and refund reconciliation verified'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stripe-phase25-hosted-checkout-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkout.json
          if-no-files-found: ignore
