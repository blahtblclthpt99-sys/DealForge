name: Stripe Phase 2.5 Hosted Checkout Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stripe-phase25-e2e-v6.yml']
permissions:
  contents: read
  statuses: write
jobs:
  checkout-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CERT_EMAIL: phase25-hosted-gate-20260824@example.com
      CHECKOUT_KEY: phase25-hosted-gate-20260824
    steps:
      - uses: actions/checkout@v4

      - name: Run Stripe helper unit tests
        run: |
          npm ci --no-fund --no-audit
          npm run test -- --runInBand 2>/dev/null || npm test

      - name: Create live test-mode Checkout Session
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o checkout.json -w '%{http_code}' \
            -X POST 'https://www.deal-forge.sale/api/checkout' \
            -H 'content-type: application/json' \
            --data "{\"checkoutKey\":\"${CHECKOUT_KEY}\",\"email\":\"${CERT_EMAIL}\",\"items\":[{\"productId\":\"cert_test_75c_20260822_v2\",\"quantity\":1}]}")

          state=failure
          [[ "$code" == 201 ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="stripe-phase25-http-${code}" \
            -f description="Checkout HTTP ${code}"

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('checkout.json', 'utf8'));
          if (!body.checkoutUrl || !body.orderNumber) {
            throw new Error(body.error || 'checkout response invalid');
          }
          if (!body.checkoutUrl.startsWith('https://checkout.stripe.com/')) {
            throw new Error('checkout URL is not Stripe-hosted');
          }
          console.log(`Created ${body.orderNumber}`);
          NODE

          [[ "$code" == 201 ]]
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-checkout-create \
            -f description='75-cent Stripe-hosted Checkout created'

      - name: Preserve financial certification blocker
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=stripe-phase25-financial-certification \
            -f description='Needs genuine Stripe sandbox payment + webhook reconciliation'
          echo 'Hosted Checkout browser automation is intentionally not used as a payment certification gate.'
          echo 'Stripe documents security measures that prevent automated testing of Checkout frontend interfaces.'
          echo 'Phase 2.5 remains blocked until a genuine sandbox Checkout payment reaches the verified webhook and reconciles the DealForge ledger.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stripe-phase25-hosted-checkout-gate
          path: checkout.json
          if-no-files-found: error
