name: Stripe Phase 2.5 Hosted Checkout Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-phase25-e2e-v6.yml'
      - 'docs/stripe-phase25-certification-2026-08-24.md'
      - 'src/lib/stripe-commerce.ts'
      - 'src/app/api/checkout/route.ts'
      - 'src/app/api/stripe/webhook/route.ts'
      - 'src/app/api/admin/refunds/route.ts'
      - 'tests/stripe-commerce.test.ts'
permissions:
  contents: read
  statuses: write
jobs:
  checkout-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CERT_EMAIL: phase25-hosted-gate-20260824@example.com
      CHECKOUT_KEY: phase25-hosted-gate-20260824
    steps:
      - uses: actions/checkout@v4

      - name: Run Stripe helper unit tests
        run: |
          npm ci --no-fund --no-audit
          npm test

      - name: Create live test-mode Checkout Session
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o checkout.json -w '%{http_code}' \
            -X POST 'https://www.deal-forge.sale/api/checkout' \
            -H 'content-type: application/json' \
            --data "{\"checkoutKey\":\"${CHECKOUT_KEY}\",\"email\":\"${CERT_EMAIL}\",\"items\":[{\"productId\":\"cert_test_75c_20260822_v2\",\"quantity\":1}]}"
          )

          state=failure
          [[ "$code" == 201 ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="stripe-phase25-http-${code}" \
            -f description="Checkout HTTP ${code}"

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('checkout.json', 'utf8'));
          if (!body.checkoutUrl || !body.orderNumber) {
            throw new Error(body.error || 'checkout response invalid');
          }
          if (!body.checkoutUrl.startsWith('https://checkout.stripe.com/')) {
            throw new Error('checkout URL is not Stripe-hosted');
          }
          console.log(`Created/reused ${body.orderNumber}`);
          NODE

          [[ "$code" == 201 ]]
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-checkout-create \
            -f description='75-cent Stripe-hosted Checkout created'

      - name: Verify recorded financial certification
        run: |
          set -euo pipefail
          report='docs/stripe-phase25-certification-2026-08-24.md'
          test -f "$report"
          grep -Fq 'Status: **CERTIFIED**' "$report"
          grep -Fq 'pending_payment -> paid' "$report"
          grep -Fq 'paid -> refunded' "$report"
          grep -Fq 'pi_3U84CoRFopwBpZeP1BRJxV6X' "$report"
          grep -Fq 're_3U84CoRFopwBpZeP1TtbLyyy' "$report"

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=stripe-phase25-financial-certification \
            -f description='Certified sandbox payment, webhook ledger, and refund reconciliation'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stripe-phase25-hosted-checkout-gate
          path: checkout.json
          if-no-files-found: error
