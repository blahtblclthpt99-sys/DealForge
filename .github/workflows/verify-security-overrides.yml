name: Verify DealForge Security Overrides

on:
  push:
    branches:
      - migration/koyeb-neon

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/koyeb-neon

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile for overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install refreshed dependency tree
        run: npm ci

      - name: Create ephemeral CI database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches verified overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: lock verified PostCSS and sharp overrides"
          git push origin HEAD:migration/koyeb-neon
