name: Phase 3 Guarded Commerce CI

on:
  pull_request:
    branches:
      - migration/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_WORKERS: "1"
      DATABASE_URL: postgresql://dealforge:ci-only@db.invalid/dealforge?sslmode=require
      AUTH_SECRET: ci-only-not-for-production-00000000000000000000000000000000
      NEXT_PUBLIC_APP_URL: https://www.deal-forge.sale
      NEXT_PUBLIC_APP_NAME: DealForge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Guarded commerce core tests
        run: npm run test:commerce-core

      - name: Stripe payment integrity tests
        run: npx tsx --test tests/stripe-commerce.test.ts

      - name: Merchant-of-record source-of-truth guard
        run: |
          set -euo pipefail
          grep -Fq 'merchant-of-record deal commerce and sourcing platform' package.json
          grep -Fq 'DealForge is a **merchant-of-record commerce platform**' docs/CATALOG_OPERATIONS.md
          grep -Fq 'PRICE_CAP_EXCEEDED' src/lib/dynamic-pricing.ts
          grep -Fq 'SOURCE_STALE' src/lib/landed-cost.ts
          grep -Fq 'BLOCKED_FINANCIAL_GATE' src/lib/commerce-eligibility.ts
          grep -Fq 'BLOCKED_PRICE_CAP' src/lib/commerce-eligibility.ts
          grep -Fq 'isProductOwner' src/app/api/admin/pricing/quote/route.ts
          grep -Fq 'quoteSellingPrice' src/app/api/admin/pricing/quote/route.ts
          grep -Fq 'isProductOwner' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'isFinancialGateCertified' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'mutatesCatalog: false' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'DEALFORGE_FINANCIAL_GATE_CERTIFIED' wrangler.jsonc

      - name: Controlled recommendation persistence guard
        run: |
          set -euo pipefail
          ROUTE='src/app/api/admin/commerce/products/[id]/recommendation/route.ts'
          test -f "$ROUTE"
          grep -Fq 'confirm: z.literal("SAVE_RECOMMENDATION")' "$ROUTE"
          grep -Fq 'isProductOwner' "$ROUTE"
          grep -Fq 'isFinancialGateCertified' "$ROUTE"
          grep -Fq 'sourceIdentity:' "$ROUTE"
          grep -Fq 'retailer: current.retailer' "$ROUTE"
          grep -Fq 'affiliateUrl: current.affiliateUrl' "$ROUTE"
          grep -Fq 'asin: current.asin' "$ROUTE"
          grep -Fq 'specifications: current.specifications' "$ROUTE"
          grep -Fq 'landedCostCents: assessment.landedCostCents' "$ROUTE"
          grep -Fq 'sellingPriceCents: assessment.recommendedSellingPriceCents' "$ROUTE"
          grep -Fq 'commerceRecommendation: recommendationAudit' "$ROUTE"
          grep -Fq 'commerceEnabled: false' "$ROUTE"
          node <<'NODE'
          const fs = require('node:fs');
          const route = 'src/app/api/admin/commerce/products/[id]/recommendation/route.ts';
          const source = fs.readFileSync(route, 'utf8');
          const start = source.indexOf('const write = await tx.product.updateMany({');
          const end = source.indexOf('});', start);
          if (start < 0 || end < 0) throw new Error('Recommendation updateMany block not found');
          const block = source.slice(start, end);
          const dataStart = block.indexOf('data:');
          if (dataStart < 0) throw new Error('Recommendation update data block not found');
          if (/commerceEnabled\s*:/.test(block.slice(dataStart))) throw new Error('Recommendation update data must never write commerceEnabled');
          NODE

      - name: Direct-commerce storefront authority guard
        run: |
          set -euo pipefail
          grep -Fq 'commerceEnabled: boolean' src/lib/products.ts
          grep -Fq 'directCommerceReady: boolean' src/lib/products.ts
          grep -Fq 'sellingPriceCents: number | null' src/lib/products.ts
          grep -Fq 'specifications: Record<string, unknown>' src/lib/products.ts
          grep -Fq 'sellerLabel: "DealForge"' src/lib/commerce-display.ts
          grep -Fq 'product.directCommerceReady' src/lib/commerce-display.ts
          grep -Fq 'checkRecommendationSourceBinding' src/lib/commerce-display.ts
          grep -Fq 'sourceBinding?.bound === true' src/lib/commerce-display.ts
          grep -Fq 'fetch("/api/checkout"' src/components/direct-buy-button.tsx
          grep -Fq 'DirectBuyButton' 'src/app/product/[slug]/page.tsx'

      - name: Direct-commerce runtime safety guard
        run: |
          set -euo pipefail
          test -f src/lib/direct-commerce-readiness.ts
          test -f src/lib/commerce-runtime-safety.ts
          grep -Fq 'BLOCKED_FINANCIAL_GATE' src/lib/direct-commerce-readiness.ts
          grep -Fq 'SOURCE_STALE' src/lib/direct-commerce-readiness.ts
          grep -Fq 'FINANCIAL_DRIFT' src/lib/direct-commerce-readiness.ts
          grep -Fq 'checkDirectCommerceReadiness' src/lib/commerce-runtime-safety.ts
          grep -Fq 'checkRecommendationSourceBinding' src/lib/commerce-runtime-safety.ts
          grep -Fq 'checkDirectCommerceProductSafety' src/app/api/checkout/route.ts
          grep -Fq 'sourceUrl: product.affiliateUrl' src/app/api/checkout/route.ts
          grep -Fq 'checkDirectCommerceProductSafety' src/app/api/checkout/resume/route.ts
          grep -Fq 'CHECKOUT_REVALIDATION_REQUIRED' src/app/api/checkout/resume/route.ts

      - name: Owner activation and deactivation guard
        run: |
          set -euo pipefail
          ACT='src/app/api/admin/commerce/products/[id]/activation/route.ts'
          DEACT='src/app/api/admin/commerce/products/[id]/deactivation/route.ts'
          test -f "$ACT"
          test -f "$DEACT"
          grep -Fq 'confirm: z.literal("ACTIVATE_DIRECT_COMMERCE")' "$ACT"
          grep -Fq 'manualProcurementAcknowledged: z.literal(true)' "$ACT"
          grep -Fq 'automaticSupplierPurchasingEnabled: false' "$ACT"
          grep -Fq 'commerceEnabled: true' "$ACT"
          grep -Fq 'confirm: z.literal("DEACTIVATE_DIRECT_COMMERCE")' "$DEACT"
          grep -Fq 'commerceEnabled: false' "$DEACT"
          grep -Fq 'SOURCE_IDENTITY_DRIFT' src/lib/commerce-source-binding.ts

      - name: Owner commerce console guard
        run: |
          set -euo pipefail
          LOOKUP='src/app/api/admin/commerce/products/route.ts'
          CONSOLE='src/components/owner-commerce-console.tsx'
          test -f "$LOOKUP"
          test -f "$CONSOLE"
          grep -Fq 'isProductOwner' "$LOOKUP"
          grep -Fq 'private, no-store, max-age=0' "$LOOKUP"
          grep -Fq 'OwnerCommerceConsole' src/app/admin/page.tsx
          grep -Fq 'ownerTools ? <OwnerCommerceConsole /> : null' src/app/admin/page.tsx
          grep -Fq 'SAVE_RECOMMENDATION' "$CONSOLE"
          grep -Fq 'ACTIVATE_DIRECT_COMMERCE' "$CONSOLE"
          grep -Fq 'DEACTIVATE_DIRECT_COMMERCE' "$CONSOLE"
          grep -Fq 'manualProcurementAcknowledged' "$CONSOLE"

      - name: Automated quarantine guard
        run: |
          set -euo pipefail
          SAFETY='src/workers/commerce-safety.ts'
          MAINT='src/app/api/internal/maintenance/route.ts'
          test -f "$SAFETY"
          grep -Fq 'checkDirectCommerceProductSafety' "$SAFETY"
          grep -Fq 'where: { commerceEnabled: true }' "$SAFETY"
          grep -Fq 'commerceEnabled: false' "$SAFETY"
          grep -Fq 'automaticSupplierPurchasingEnabled: false' "$SAFETY"
          grep -Fq 'quarantineUnsafeDirectCommerce' "$MAINT"
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/workers/commerce-safety.ts', 'utf8');
          if (/data:\s*\{[^}]*commerceEnabled:\s*true/s.test(source)) throw new Error('Automated commerce safety must never activate products');
          NODE

      - name: Manual sourcing and fulfillment guard
        run: |
          set -euo pipefail
          LIST='src/app/api/admin/commerce/orders/route.ts'
          ACT='src/app/api/admin/commerce/orders/[id]/fulfillment/route.ts'
          UI='src/components/owner-fulfillment-console.tsx'
          test -f src/lib/order-fulfillment.ts
          test -f "$LIST"
          test -f "$ACT"
          test -f "$UI"
          grep -Fq 'isProductOwner' "$LIST"
          grep -Fq 'private, no-store, max-age=0' "$LIST"
          grep -Fq '? { status: "paid" }' "$LIST"
          grep -Fq 'order.status !== "paid"' "$ACT"
          grep -Fq 'payment.providerPaymentId === order.stripePaymentIntentId' "$ACT"
          grep -Fq 'manualPurchaseConfirmed: z.literal(true)' "$ACT"
          grep -Fq 'SUPPLIER_COST_VARIANCE_REQUIRES_ACKNOWLEDGEMENT' "$ACT"
          grep -Fq 'SUPPLIER_COST_LOSS_RISK_REQUIRES_ACKNOWLEDGEMENT' "$ACT"
          grep -Fq 'updatedAt: current.updatedAt' "$ACT"
          grep -Fq 'data: { updatedAt: now }' "$ACT"
          grep -Fq 'automaticSupplierPurchasingEnabled: false' "$ACT"
          grep -Fq 'OwnerFulfillmentConsole' src/app/admin/page.tsx
          grep -Fq 'ownerTools ? <OwnerFulfillmentConsole /> : null' src/app/admin/page.tsx
          grep -Fq 'Confirm supplier ordered manually' "$UI"
          grep -Fq 'manualPurchaseConfirmed: true' "$UI"
          grep -Fq 'MARK_SHIPPED' "$UI"
          grep -Fq 'MARK_DELIVERED' "$UI"
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/app/api/admin/commerce/orders/[id]/fulfillment/route.ts', 'utf8');
          if (/data:\s*\{[^}]*status\s*:/s.test(source)) throw new Error('Fulfillment operations must not write Order financial status');
          if (/stripe/i.test(source) && /createStripe|refund|paymentIntent|checkoutSession/.test(source)) throw new Error('Fulfillment operations must not invoke Stripe');
          NODE

      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Wrangler dry-run
        run: npm run cf:dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
