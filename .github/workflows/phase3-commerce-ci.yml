name: Phase 3 Guarded Commerce CI

on:
  pull_request:
    branches:
      - migration/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_WORKERS: "1"
      DATABASE_URL: postgresql://dealforge:ci-only@db.invalid/dealforge?sslmode=require
      AUTH_SECRET: ci-only-not-for-production-00000000000000000000000000000000
      NEXT_PUBLIC_APP_URL: https://www.deal-forge.sale
      NEXT_PUBLIC_APP_NAME: DealForge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Guarded commerce core tests
        run: npm run test:commerce-core

      - name: Stripe payment integrity tests
        run: npx tsx --test tests/stripe-commerce.test.ts

      - name: Merchant-of-record source-of-truth guard
        run: |
          set -euo pipefail
          grep -Fq 'merchant-of-record deal commerce and sourcing platform' package.json
          grep -Fq 'DealForge is a **merchant-of-record commerce platform**' docs/CATALOG_OPERATIONS.md
          grep -Fq 'PRICE_CAP_EXCEEDED' src/lib/dynamic-pricing.ts
          grep -Fq 'SOURCE_STALE' src/lib/landed-cost.ts
          grep -Fq 'BLOCKED_FINANCIAL_GATE' src/lib/commerce-eligibility.ts
          grep -Fq 'BLOCKED_PRICE_CAP' src/lib/commerce-eligibility.ts
          grep -Fq 'isProductOwner' src/app/api/admin/pricing/quote/route.ts
          grep -Fq 'quoteSellingPrice' src/app/api/admin/pricing/quote/route.ts
          grep -Fq 'isProductOwner' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'isFinancialGateCertified' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'mutatesCatalog: false' src/app/api/admin/commerce/assess/route.ts
          grep -Fq 'DEALFORGE_FINANCIAL_GATE_CERTIFIED' wrangler.jsonc

      - name: Controlled recommendation persistence guard
        run: |
          set -euo pipefail
          ROUTE='src/app/api/admin/commerce/products/[id]/recommendation/route.ts'
          test -f "$ROUTE"
          grep -Fq 'confirm: z.literal("SAVE_RECOMMENDATION")' "$ROUTE"
          grep -Fq 'isProductOwner' "$ROUTE"
          grep -Fq 'isFinancialGateCertified' "$ROUTE"
          grep -Fq 'if (product.commerceEnabled)' "$ROUTE"
          grep -Fq 'updateMany' "$ROUTE"
          grep -Fq 'where: { id: product.id, commerceEnabled: false }' "$ROUTE"
          grep -Fq 'RECOMMENDATION_ROUTE_PRODUCT_BECAME_ACTIVE' "$ROUTE"
          grep -Fq 'landedCostCents: assessment.landedCostCents' "$ROUTE"
          grep -Fq 'sellingPriceCents: assessment.recommendedSellingPriceCents' "$ROUTE"
          grep -Fq 'commerceRecommendation: recommendationAudit' "$ROUTE"
          grep -Fq 'commerceEnabled: false' "$ROUTE"
          node <<'NODE'
          const fs = require('node:fs');
          const route = 'src/app/api/admin/commerce/products/[id]/recommendation/route.ts';
          const source = fs.readFileSync(route, 'utf8');
          const start = source.indexOf('const write = await tx.product.updateMany({');
          const end = source.indexOf('});', start);
          if (start < 0 || end < 0) throw new Error('Recommendation updateMany block not found');
          const block = source.slice(start, end);
          const dataStart = block.indexOf('data:');
          if (dataStart < 0) throw new Error('Recommendation update data block not found');
          if (/commerceEnabled\s*:/.test(block.slice(dataStart))) {
            throw new Error('Recommendation update data must never write commerceEnabled');
          }
          NODE

      - name: Direct-commerce storefront authority guard
        run: |
          set -euo pipefail
          grep -Fq 'commerceEnabled: boolean' src/lib/products.ts
          grep -Fq 'directCommerceReady: boolean' src/lib/products.ts
          grep -Fq 'directCommerceReadinessReason: DirectCommerceReadinessReason' src/lib/products.ts
          grep -Fq 'sellingPriceCents: number | null' src/lib/products.ts
          grep -Fq 'specifications: Record<string, unknown>' src/lib/products.ts
          grep -Fq 'checkDirectCommerceReadiness' src/lib/products.ts
          grep -Fq 'sellerLabel: "DealForge"' src/lib/commerce-display.ts
          grep -Fq 'product.directCommerceReady' src/lib/commerce-display.ts
          grep -Fq 'product.sellingPriceCents' src/lib/commerce-display.ts
          grep -Fq 'product.availability === "in_stock"' src/lib/commerce-display.ts
          grep -Fq 'fetch("/api/checkout"' src/components/direct-buy-button.tsx
          grep -Fq 'items: [{ productId, quantity: 1 }]' src/components/direct-buy-button.tsx
          grep -Fq 'DirectBuyButton' 'src/app/product/[slug]/page.tsx'
          grep -Fq 'commercerecommendation' 'src/app/product/[slug]/page.tsx'
          grep -Fq '!commerce.isDirectCommerce' 'src/app/product/[slug]/page.tsx'

      - name: Direct-commerce runtime readiness guard
        run: |
          set -euo pipefail
          test -f src/lib/direct-commerce-readiness.ts
          grep -Fq 'BLOCKED_FINANCIAL_GATE' src/lib/direct-commerce-readiness.ts
          grep -Fq 'SOURCE_STALE' src/lib/direct-commerce-readiness.ts
          grep -Fq 'FINANCIAL_DRIFT' src/lib/direct-commerce-readiness.ts
          grep -Fq 'checkDirectCommerceReadiness' src/app/api/checkout/route.ts
          grep -Fq 'isFinancialGateCertified' src/app/api/checkout/route.ts
          grep -Fq 'checkDirectCommerceReadiness' src/app/api/checkout/resume/route.ts
          grep -Fq 'CHECKOUT_REVALIDATION_REQUIRED' src/app/api/checkout/resume/route.ts
          grep -Fq 'item.unitPriceCents !== product.sellingPriceCents' src/app/api/checkout/resume/route.ts
          grep -Fq 'item.landedCostCents !== product.landedCostCents' src/app/api/checkout/resume/route.ts

      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Wrangler dry-run
        run: npm run cf:dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
