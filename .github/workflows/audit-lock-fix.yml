name: DealForge Audit Lock Refresh

on:
  push:
    branches:
      - migration/koyeb-neon

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration/koyeb-neon

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Show remaining high-severity audit findings
        run: npm audit --audit-level=high || true

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No non-breaking dependency updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh dependencies with npm audit fix"
          git push origin HEAD:migration/koyeb-neon
