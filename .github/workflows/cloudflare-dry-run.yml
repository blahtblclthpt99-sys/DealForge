name: Cloudflare Workers Dry Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workers-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_WORKERS: "1"
      DATABASE_URL: postgresql://dealforge:ci-only@db.invalid/dealforge?sslmode=require
      AUTH_SECRET: ci-only-not-for-production-00000000000000000000000000000000
      NEXT_PUBLIC_APP_URL: https://www.deal-forge.sale
      NEXT_PUBLIC_APP_NAME: DealForge
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked Cloudflare dependencies
        run: npm ci --no-fund --no-audit
      - name: Build Next.js for Cloudflare workerd
        run: npm run cf:build
      - name: Wrangler bundle dry run
        run: npm run cf:dry-run
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
