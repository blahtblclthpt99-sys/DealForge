name: Live Release Certification PR

on:
  pull_request:
    branches: [migration/cloudflare-workers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_DEPLOYED_SHA: 340ea4580ee7063f8df1ff96581d163654c89c93
      WORKER_URL: https://dealforge.blahtblclthpt99.workers.dev
      WWW_URL: https://www.deal-forge.sale
      APEX_URL: https://deal-forge.sale
    steps:
      - name: Wait for exact production Worker
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/build.json -w '%{http_code}' "$WORKER_URL/api/build" || echo 000)
            sha=""
            if [[ "$code" == "200" ]]; then
              sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
              )
            fi
            echo "attempt=$attempt code=$code deployed=${sha:-missing} expected=$EXPECTED_DEPLOYED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_DEPLOYED_SHA" ]]; then ready=1; break; fi
            sleep 10
          done
          [[ "$ready" == "1" ]]

      - name: Check public Worker routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /categories /deals /search /login /register; do
            body="/tmp/route-$(echo "$path" | tr '/' '_').html"
            code=$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$WORKER_URL$path" || echo 000)
            echo "$path -> $code"
            [[ "$code" == "200" ]]
          done
          grep -qi 'Forge better deals' /tmp/route-_.html
          grep -qi 'Product Finder' /tmp/route-_search.html

      - name: Check storefront price rendering
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/home.html
          curl -fsSL --max-time 30 "$WORKER_URL/" -o "$body"
          if grep -Eqi '\$[0-9]+\.[0-9]{2}' "$body"; then
            echo 'Price amount is visible on the storefront.'
          elif grep -Eqi 'recorded price|verify current price' "$body"; then
            echo 'Recorded-price state is visible on the storefront.'
          else
            echo 'No storefront price state found.' >&2
            exit 1
          fi

      - name: Check protected owner and admin routes
        shell: bash
        run: |
          set -euo pipefail
          admin=$(curl -sS --max-time 20 --max-redirs 0 -o /dev/null -w '%{http_code}' "$WORKER_URL/admin" || echo 000)
          owner=$(curl -sS --max-time 20 -o /tmp/owner.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"refresh"}' "$WORKER_URL/api/admin/product-intake" || echo 000)
          maintenance=$(curl -sS --max-time 20 -o /tmp/maintenance.json -w '%{http_code}' -X POST "$WORKER_URL/api/internal/maintenance" || echo 000)
          echo "admin=$admin owner-api=$owner unsigned-maintenance=$maintenance"
          [[ "$admin" =~ ^30[2378]$ ]]
          [[ "$owner" == "401" ]]
          [[ "$maintenance" == "401" ]]

      - name: Diagnose DNS and custom domains
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          echo "NS: $(dig +short NS deal-forge.sale | tr '\n' ' ')"
          echo "APEX A: $(dig +short A deal-forge.sale | tr '\n' ' ')"
          echo "APEX AAAA: $(dig +short AAAA deal-forge.sale | tr '\n' ' ')"
          echo "WWW CNAME: $(dig +short CNAME www.deal-forge.sale | tr '\n' ' ')"
          echo "WWW A: $(dig +short A www.deal-forge.sale | tr '\n' ' ')"
          for base in "$WWW_URL" "$APEX_URL"; do
            safe=$(printf '%s' "$base" | tr -cd '[:alnum:]')
            headers="/tmp/${safe}.headers"
            body="/tmp/${safe}.body"
            code=$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$base/" || echo 000)
            echo "===== $base -> $code ====="
            sed -n '1,30p' "$headers" || true
            echo "----- body preview -----"
            head -c 1200 "$body" | tr '\n' ' ' || true
            echo
            if [[ "$code" != "200" ]]; then
              failed=1
              continue
            fi
            if ! grep -qi 'Forge better deals' "$body"; then failed=1; fi
            build=$(curl -sS --max-time 30 "$base/api/build" || true)
            sha=$(printf '%s' "$build" | python -c 'import json,sys
try: print(json.load(sys.stdin).get("sha",""))
except Exception: print("")')
            echo "$base sha=$sha"
            if [[ "$sha" != "$EXPECTED_DEPLOYED_SHA" ]]; then failed=1; fi
          done
          exit "$failed"
