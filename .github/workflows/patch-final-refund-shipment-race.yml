name: Apply final refund shipment race hardening

on:
  push:
    branches:
      - hardening/final-refund-shipment-race-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/final-refund-shipment-race-20260826
          fetch-depth: 0
      - name: Apply deterministic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shipment_path = Path('src/app/api/admin/procurement/[id]/shipment/route.ts')
          shipment = shipment_path.read_text()

          old = '''import {
            isProcurementStatus,
            procurementEventKey,
            transitionProcurement,
          } from "@/lib/procurement-state-machine";'''
          new = old + '''
          import { hasActiveRefund } from "@/lib/refund-procurement-interlock";'''
          assert shipment.count(old) == 1
          shipment = shipment.replace(old, new)

          old = '          order: { select: { status: true, paidAt: true } },'
          new = '''          order: {
            select: {
              status: true,
              paidAt: true,
              refunds: { select: { status: true } },
            },
          },'''
          assert shipment.count(old) == 1
          shipment = shipment.replace(old, new)

          old = '              type: { in: ["RECORD_MANUAL_PURCHASE", "RECORD_SHIPMENT", "MARK_DELIVERED"] },'
          new = '''              type: {
                in: [
                  "RECORD_MANUAL_PURCHASE",
                  "RECORD_SHIPMENT",
                  "MARK_DELIVERED",
                  "POST_PURCHASE_REFUND_EXCEPTION_APPROVED",
                ],
              },'''
          assert shipment.count(old) == 1
          shipment = shipment.replace(old, new)

          old = '''      if (current.order.status !== "paid" || !current.order.paidAt) {
            throw new Error("PROCUREMENT_ORDER_NOT_PAID");
          }
          if (!isProcurementStatus(current.status) || current.status !== parsed.data.expectedState) {'''
          new = '''      if (current.order.status !== "paid" || !current.order.paidAt) {
            throw new Error("PROCUREMENT_ORDER_NOT_PAID");
          }
          if (hasActiveRefund(current.order.refunds)) {
            throw new Error("SHIPMENT_BLOCKED_BY_ACTIVE_REFUND");
          }
          if (current.events.some((event) => event.type === "POST_PURCHASE_REFUND_EXCEPTION_APPROVED")) {
            throw new Error("SHIPMENT_BLOCKED_BY_POST_PURCHASE_REFUND_EXCEPTION");
          }
          if (!isProcurementStatus(current.status) || current.status !== parsed.data.expectedState) {'''
          assert shipment.count(old) == 1
          shipment = shipment.replace(old, new)
          shipment_path.write_text(shipment)

          refund_path = Path('src/app/api/admin/refunds/route.ts')
          refund = refund_path.read_text()
          old = '''    if (!stripeRefund.id) throw new Error("STRIPE_REFUND_ID_MISSING");
          const refund = await prisma.refund.create({'''
          new = '''    if (!stripeRefund.id) throw new Error("STRIPE_REFUND_ID_MISSING");
          if (stripeRefund.amount !== parsed.data.amountCents) {
            throw new Error("STRIPE_REFUND_AMOUNT_MISMATCH");
          }
          if (stripeRefund.currency.toLowerCase() !== order.currency.toLowerCase()) {
            throw new Error("STRIPE_REFUND_CURRENCY_MISMATCH");
          }
          const refund = await prisma.refund.create({'''
          assert refund.count(old) == 1
          refund_path.write_text(refund.replace(old, new))

          test_path = Path('tests/refund-shipment-race-hardening.test.ts')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("shipment and delivery fail closed during refund activity", async () => {\n  const source = await readFile("src/app/api/admin/procurement/[id]/shipment/route.ts", "utf8");\n  assert.match(source, /hasActiveRefund\\(current\\.order\\.refunds\\)/);\n  assert.match(source, /SHIPMENT_BLOCKED_BY_ACTIVE_REFUND/);\n  assert.match(source, /POST_PURCHASE_REFUND_EXCEPTION_APPROVED/);\n  assert.match(source, /SHIPMENT_BLOCKED_BY_POST_PURCHASE_REFUND_EXCEPTION/);\n  assert.ok(source.indexOf("SHIPMENT_BLOCKED_BY_ACTIVE_REFUND") < source.indexOf("transitionProcurement(current.status"));\n});\n\ntest("refund dispatch requires Stripe to echo exact authorized economics", async () => {\n  const source = await readFile("src/app/api/admin/refunds/route.ts", "utf8");\n  assert.match(source, /stripeRefund\\.amount !== parsed\\.data\\.amountCents/);\n  assert.match(source, /STRIPE_REFUND_AMOUNT_MISMATCH/);\n  assert.match(source, /stripeRefund\\.currency\\.toLowerCase\\(\\) !== order\\.currency\\.toLowerCase\\(\\)/);\n  assert.match(source, /STRIPE_REFUND_CURRENCY_MISMATCH/);\n  assert.ok(source.indexOf("STRIPE_REFUND_AMOUNT_MISMATCH") < source.indexOf("prisma.refund.create"));\n});\n''')
          PY

          rm .github/workflows/patch-final-refund-shipment-race.yml
          git config user.name "DealForge Gatekeeper"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/admin/procurement/[id]/shipment/route.ts src/app/api/admin/refunds/route.ts tests/refund-shipment-race-hardening.test.ts .github/workflows/patch-final-refund-shipment-race.yml
          git diff --cached --check
          git commit -m "Phase 3: close refund shipment race"
          git push origin HEAD:hardening/final-refund-shipment-race-20260826
