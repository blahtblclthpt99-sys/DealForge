name: Live Storefront Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-storefront-probe-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe homepage
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 4 --retry-all-errors --retry-delay 2 -sS -o /tmp/home -w '%{http_code}' 'https://www.deal-forge.sale/')
          state=failure
          desc="Homepage HTTP ${code}"
          if [[ "$code" == 200 ]] && ! grep -qiE 'Database not connected|Could not load the live catalog' /tmp/home; then
            state=success
            desc='Homepage rendered live catalog shell without setup fallback'
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context=dealforge-live-homepage -f description="$desc"
          [[ "$state" == success ]]

      - name: Probe certification checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          key="phase25-stage-probe-${GITHUB_SHA:0:12}"
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o /tmp/checkout -w '%{http_code}' \
            -X POST 'https://www.deal-forge.sale/api/checkout' \
            -H 'content-type: application/json' \
            --data "{\"checkoutKey\":\"${key}\",\"email\":\"phase25-stage-probe@example.com\",\"items\":[{\"productId\":\"cert_test_75c_20260822_v2\",\"quantity\":1}]}")
          error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/checkout','utf8'));process.stdout.write(String(j.error||''))}catch{process.stdout.write('invalid-json')}")
          stage=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/checkout','utf8'));process.stdout.write(String(j.stage||'none'))}catch{process.stdout.write('invalid-json')}")
          safe_error=$(printf '%s' "${error:-none}" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-50)
          safe_stage=$(printf '%s' "${stage:-none}" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-50)
          state=failure
          [[ "$code" == 201 ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context=dealforge-live-checkout -f description="Checkout HTTP ${code}; ${error:-no error}; stage ${stage}"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="dealforge-live-checkout-${safe_error}" -f description="Sanitized checkout result"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="dealforge-live-stage-${safe_stage}" -f description="Sanitized checkout failure stage"
          [[ "$state" == success ]]
