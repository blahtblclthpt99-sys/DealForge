name: Live Transaction Certification Checkout

on:
  pull_request:
    branches:
      - migration/cloudflare-workers

permissions:
  contents: read

jobs:
  wait-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: fa72d9deeac545154450ed0a92f2a0a7abc45cee
      PRODUCTION_URL: https://www.deal-forge.sale
    steps:
      - name: Wait for exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 42); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/build.json --write-out '%{http_code}' "$PRODUCTION_URL/api/build" || echo 000)
            sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt http=$code sha=$sha expected=$EXPECTED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_SHA" ]]; then
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == "1" ]]
