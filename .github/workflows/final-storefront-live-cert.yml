name: Final Storefront Live Certification

on:
  pull_request:
    branches: [migration/cloudflare-workers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: cbc821aee4ff3f9a20b4be836f566f376bd6bfda
      WORKER_URL: https://dealforge.blahtblclthpt99.workers.dev
      WWW_URL: https://www.deal-forge.sale
      APEX_URL: https://deal-forge.sale
      BROWSER_UA: Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1
    steps:
      - name: Wait for exact production Worker
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 20 -o /tmp/build.json -w '%{http_code}' "$WORKER_URL/api/build" || echo 000)
            sha=""
            if [[ "$code" == "200" ]]; then
              sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
              )
            fi
            echo "attempt=$attempt code=$code deployed=${sha:-missing} expected=$EXPECTED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_SHA" ]]; then ready=1; break; fi
            sleep 10
          done
          [[ "$ready" == "1" ]]

      - name: Verify Worker storefront and price visibility
        shell: bash
        run: |
          set -euo pipefail
          for path in / /categories /deals /search /login /register; do
            code=$(curl -sS -L --max-time 30 -o "/tmp/route-$(echo "$path" | tr '/' '_').html" -w '%{http_code}' "$WORKER_URL$path" || echo 000)
            echo "$path -> $code"
            [[ "$code" == "200" ]]
          done
          grep -qi 'Forge better deals' /tmp/route-_.html
          grep -qi 'Product Finder' /tmp/route-_search.html
          grep -Eqi '(\$[0-9]+\.[0-9]{2}|Recorded price)' /tmp/route-_.html

      - name: Verify protected owner/admin endpoints
        shell: bash
        run: |
          set -euo pipefail
          admin=$(curl -sS --max-time 20 --max-redirs 0 -o /dev/null -w '%{http_code}' "$WORKER_URL/admin" || echo 000)
          owner=$(curl -sS --max-time 20 -o /tmp/owner.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"refresh"}' "$WORKER_URL/api/admin/product-intake" || echo 000)
          maintenance=$(curl -sS --max-time 20 -o /tmp/maintenance.json -w '%{http_code}' -X POST "$WORKER_URL/api/internal/maintenance" || echo 000)
          echo "admin=$admin owner-api=$owner unsigned-maintenance=$maintenance"
          [[ "$admin" =~ ^30[2378]$ ]]
          [[ "$owner" == "401" ]]
          [[ "$maintenance" == "401" ]]

      - name: Verify DNS and browser-like custom-domain access
        shell: bash
        run: |
          set -euo pipefail
          ns=$(dig +short NS deal-forge.sale | tr '\n' ' ')
          echo "nameservers=$ns"
          [[ "$ns" == *"ns.cloudflare.com"* ]]
          failed=0
          for base in "$WWW_URL" "$APEX_URL"; do
            host=$(printf '%s' "$base" | sed 's#https://##')
            raw=$(curl -sS -L --max-time 30 -D "/tmp/${host}.raw.headers" -o "/tmp/${host}.raw.body" -w '%{http_code}' "$base/" || echo 000)
            browser=$(curl -sS -L --max-time 30 -A "$BROWSER_UA" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9' -D "/tmp/${host}.browser.headers" -o "/tmp/${host}.browser.body" -w '%{http_code}' "$base/" || echo 000)
            echo "$base raw=$raw browser=$browser"
            if grep -qi '^cf-mitigated: challenge' "/tmp/${host}.raw.headers"; then echo 'raw request challenged by Cloudflare'; fi
            if grep -qi '^cf-mitigated: challenge' "/tmp/${host}.browser.headers"; then echo 'browser-like request challenged by Cloudflare'; fi
            if [[ "$browser" != "200" ]] || ! grep -qi 'Forge better deals' "/tmp/${host}.browser.body"; then
              sed -n '1,25p' "/tmp/${host}.browser.headers" || true
              head -c 300 "/tmp/${host}.browser.body" || true
              echo
              failed=1
              continue
            fi
            build=$(curl -sS --max-time 30 -A "$BROWSER_UA" "$base/api/build" || true)
            sha=$(printf '%s' "$build" | python -c 'import json,sys\ntry: print(json.load(sys.stdin).get("sha",""))\nexcept Exception: print("")')
            echo "$base sha=$sha"
            [[ "$sha" == "$EXPECTED_SHA" ]] || failed=1
          done
          [[ "$failed" == "0" ]]
