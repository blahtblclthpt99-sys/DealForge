name: Final Storefront Live Certification

on:
  pull_request:
    branches: [migration/cloudflare-workers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: cbc821aee4ff3f9a20b4be836f566f376bd6bfda
      WORKER_URL: https://dealforge.blahtblclthpt99.workers.dev
      WWW_URL: https://www.deal-forge.sale
      APEX_URL: https://deal-forge.sale
    steps:
      - name: Wait for exact production Worker
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS --max-time 20 -o /tmp/build.json -w '%{http_code}' "$WORKER_URL/api/build" || echo 000)
            sha=""
            if [[ "$code" == "200" ]]; then
              sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
              )
            fi
            echo "attempt=$attempt code=$code deployed=${sha:-missing} expected=$EXPECTED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_SHA" ]]; then ready=1; break; fi
            sleep 10
          done
          [[ "$ready" == "1" ]]

      - name: Verify public storefront routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /categories /deals /search /login /register; do
            body="/tmp/route-$(echo "$path" | tr '/' '_').html"
            code=$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$WORKER_URL$path" || echo 000)
            echo "$path -> $code"
            [[ "$code" == "200" ]]
          done
          grep -qi 'Forge better deals' /tmp/route-_.html
          grep -qi 'Product Finder' /tmp/route-_search.html

      - name: Verify storefront price visibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$WORKER_URL/" -o /tmp/home.html
          grep -Eqi '(\$[0-9]+\.[0-9]{2}|Recorded price)' /tmp/home.html
          echo 'Storefront exposes a price state before product click.'

      - name: Verify protected owner/admin endpoints
        shell: bash
        run: |
          set -euo pipefail
          admin=$(curl -sS --max-time 20 --max-redirs 0 -o /dev/null -w '%{http_code}' "$WORKER_URL/admin" || echo 000)
          owner=$(curl -sS --max-time 20 -o /tmp/owner.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"refresh"}' "$WORKER_URL/api/admin/product-intake" || echo 000)
          maintenance=$(curl -sS --max-time 20 -o /tmp/maintenance.json -w '%{http_code}' -X POST "$WORKER_URL/api/internal/maintenance" || echo 000)
          echo "admin=$admin owner-api=$owner unsigned-maintenance=$maintenance"
          [[ "$admin" =~ ^30[2378]$ ]]
          [[ "$owner" == "401" ]]
          [[ "$maintenance" == "401" ]]

      - name: Diagnose and verify custom domains
        shell: bash
        run: |
          set -euo pipefail
          ns=$(dig +short NS deal-forge.sale | tr '\n' ' ')
          echo "nameservers=$ns"
          [[ "$ns" == *"ns.cloudflare.com"* ]]
          failed=0
          for base in "$WWW_URL" "$APEX_URL"; do
            host=$(printf '%s' "$base" | sed 's#https://##')
            echo "--- DNS $host ---"
            dig +short A "$host" || true
            dig +short AAAA "$host" || true
            dig +short CNAME "$host" || true
            code=$(curl -sS -L --max-time 30 -D "/tmp/${host}.headers" -o "/tmp/${host}.body" -w '%{http_code}' "$base/" || echo 000)
            echo "$base -> $code"
            sed -n '1,25p' "/tmp/${host}.headers" || true
            head -c 500 "/tmp/${host}.body" || true
            echo
            if [[ "$code" != "200" ]] || ! grep -qi 'Forge better deals' "/tmp/${host}.body"; then failed=1; continue; fi
            build=$(curl -sS --max-time 30 "$base/api/build" || true)
            sha=$(printf '%s' "$build" | python -c 'import json,sys\ntry: print(json.load(sys.stdin).get("sha",""))\nexcept Exception: print("")')
            echo "$base sha=$sha"
            [[ "$sha" == "$EXPECTED_SHA" ]] || failed=1
          done
          [[ "$failed" == "0" ]]
