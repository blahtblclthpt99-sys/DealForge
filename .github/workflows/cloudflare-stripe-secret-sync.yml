name: Cloudflare Stripe Webhook Secret Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-stripe-secret-sync.yml'
      - '.github/workflows/cloudflare-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  sync-webhook-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      STRIPE_WEBHOOK_SECRET_LEGACY: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate secure webhook secret sources
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare-stripe-secret-sync \
            -f description='Checking Stripe webhook secret sources'

          present=0
          for name in STRIPE_WEBHOOK_SECRET_LIVE STRIPE_WEBHOOK_SECRET_TEST STRIPE_WEBHOOK_SECRET_LEGACY; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            present=1
            echo "::add-mask::$value"
            if [[ "$value" != whsec_* ]]; then
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state=failure \
                -f context=cloudflare-stripe-secret-source \
                -f description="${name} has invalid format"
              echo "::error::${name} must start with whsec_."
              exit 1
            fi
          done

          if [[ "$present" != '1' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=cloudflare-stripe-secret-source \
              -f description='No GitHub Stripe webhook secret is configured'
            echo '::error::No GitHub Actions Stripe webhook signing secret is configured.'
            exit 1
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare-stripe-secret-source \
            -f description='At least one valid webhook secret source is available'

      - name: Synchronize webhook secrets without changing modes
        shell: bash
        run: |
          set -euo pipefail

          write_secret() {
            local cloudflare_name="$1"
            local value="$2"
            [[ -n "$value" ]] || return 0
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put "$cloudflare_name" --name dealforge
          }

          write_secret STRIPE_WEBHOOK_SECRET_LIVE "${STRIPE_WEBHOOK_SECRET_LIVE:-}"
          write_secret STRIPE_WEBHOOK_SECRET_TEST "${STRIPE_WEBHOOK_SECRET_TEST:-}"
          write_secret STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET_LEGACY:-}"

      - name: Verify live webhook is configured and rejects invalid signature
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.deal-forge.sale'
          code='000'
          webhook_error='unknown'

          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/webhook-body -w '%{http_code}' \
              -X POST "$base/api/stripe/webhook" \
              -H 'content-type: application/json' \
              -H 'stripe-signature: t=1,v1=deadbeef' \
              --data '{}' || true)
            webhook_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/webhook-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "webhook verification attempt ${attempt}: HTTP $code (${webhook_error})"
            [[ "$code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]] && break
            sleep 3
          done

          if [[ "$code" != '400' || "$webhook_error" != 'INVALID_STRIPE_SIGNATURE' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=cloudflare-stripe-secret-sync \
              -f description="Webhook verification failed (${code}/${webhook_error})"
            exit 1
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare-stripe-secret-sync \
            -f description='Cloudflare webhook secret synchronized and route configured'
