name: Cloudflare Stripe Webhook Secret Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-stripe-secret-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  sync-webhook-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      STRIPE_WEBHOOK_SECRET_LEGACY: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Select secure webhook secret source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare-stripe-secret-sync \
            -f description='Checking secure Stripe webhook secret source'

          if [[ -n "${STRIPE_WEBHOOK_SECRET_TEST:-}" ]]; then
            secret_value="$STRIPE_WEBHOOK_SECRET_TEST"
            source_name='STRIPE_WEBHOOK_SECRET_TEST'
          elif [[ -n "${STRIPE_WEBHOOK_SECRET_LEGACY:-}" ]]; then
            secret_value="$STRIPE_WEBHOOK_SECRET_LEGACY"
            source_name='STRIPE_WEBHOOK_SECRET'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=cloudflare-stripe-secret-source \
              -f description='No GitHub Stripe webhook secret is configured'
            echo '::error::No GitHub Actions Stripe webhook secret is configured.'
            exit 1
          fi

          [[ "$secret_value" == whsec_* ]] || {
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=cloudflare-stripe-secret-source \
              -f description='Configured webhook secret has invalid format'
            echo '::error::Configured Stripe webhook secret has an invalid format.'
            exit 1
          }

          echo "::add-mask::$secret_value"
          printf '%s' "$secret_value" > /tmp/dealforge-webhook-secret
          chmod 600 /tmp/dealforge-webhook-secret
          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare-stripe-secret-source \
            -f description='Secure webhook secret source is available'

      - name: Write test webhook secret to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/dealforge-webhook-secret
          cat /tmp/dealforge-webhook-secret | npx wrangler secret put STRIPE_WEBHOOK_SECRET_TEST --name dealforge
          rm -f /tmp/dealforge-webhook-secret

      - name: Verify live webhook rejects invalid signature
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.deal-forge.sale'
          code='000'
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/webhook-body -w '%{http_code}' \
              -X POST "$base/api/stripe/webhook" \
              -H 'content-type: application/json' \
              -H 'stripe-signature: t=1,v1=deadbeef' \
              --data '{}' || true)
            echo "webhook verification attempt ${attempt}: HTTP $code"
            [[ "$code" == '400' ]] && break
            sleep 3
          done

          if [[ "$code" != '400' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=cloudflare-stripe-secret-sync \
              -f description="Webhook still returned HTTP ${code}"
            exit 1
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare-stripe-secret-sync \
            -f description='Cloudflare webhook secret synchronized and verified'
