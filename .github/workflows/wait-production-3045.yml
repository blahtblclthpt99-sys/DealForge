name: Wait Production 3045

on:
  pull_request:
    branches:
      - migration/cloudflare-workers
    paths:
      - .github/workflows/wait-production-3045.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://www.deal-forge.sale
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Wait for exact forced redeploy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/build.json --write-out '%{http_code}' "$PRODUCTION_URL/api/build" || echo 000)
            sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt http=$code sha=$sha expected=$EXPECTED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
