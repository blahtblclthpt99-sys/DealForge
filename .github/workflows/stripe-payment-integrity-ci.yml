name: Stripe Payment Integrity CI

on:
  pull_request:
    branches:
      - migration/cloudflare-workers
  push:
    branches:
      - migration/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_WORKERS: "1"
      DATABASE_URL: postgresql://dealforge:ci-only@db.invalid/dealforge?sslmode=require
      AUTH_SECRET: ci-only-not-for-production-00000000000000000000000000000000
      NEXT_PUBLIC_APP_URL: https://www.deal-forge.sale
      NEXT_PUBLIC_APP_NAME: DealForge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Stripe unit tests
        run: npx tsx --test tests/stripe-commerce.test.ts

      - name: Webhook refund-state regression guard
        run: |
          set -euo pipefail
          grep -Fq 'const status = refunded >= order.totalCents ? "refunded" : refunded > 0 ? "partially_refunded" : "paid"' src/app/api/stripe/webhook/route.ts
          grep -Fq '["paid", "partially_refunded", "refunded"].includes(order.status)' src/app/api/stripe/webhook/route.ts

      - name: Checkout provider failure-state regression guard
        run: |
          set -euo pipefail
          grep -Fq 'async function markStripeInitializationFailed(orderId: string)' src/app/api/checkout/route.ts
          grep -Fq 'stripeCheckoutSessionId: null' src/app/api/checkout/route.ts
          grep -Fq 'status: { notIn: ["paid", "partially_refunded", "refunded"] }' src/app/api/checkout/route.ts
          grep -Fq 'data: { status: "payment_failed" }' src/app/api/checkout/route.ts
          grep -Fq 'order.status === "payment_failed" && !order.stripeCheckoutSessionId' src/app/api/checkout/route.ts

      - name: Same-origin Checkout resume regression guard
        run: |
          set -euo pipefail
          ROUTE='src/app/api/checkout/resume/route.ts'
          grep -Fq '/api/checkout/resume?order=' src/app/api/checkout/route.ts
          grep -Fq 'retrieveStripeCheckoutSession' "$ROUTE"
          grep -Fq 'sessionMatchesOrder' "$ROUTE"
          grep -Fq 'session.client_reference_id === order.id' "$ROUTE"
          grep -Fq 'session.metadata?.order_id === order.id' "$ROUTE"
          grep -Fq 'session.metadata?.order_number === order.orderNumber' "$ROUTE"
          grep -Fq 'Referrer-Policy", "no-referrer' "$ROUTE"
          grep -Fq 'NextResponse.redirect(session.url, 302)' "$ROUTE"
          grep -Fq 'checkPendingCheckoutSafety' "$ROUTE"
          grep -Fq 'expireStripeCheckoutSession' "$ROUTE"
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/app/api/checkout/resume/route.ts', 'utf8');
          const retrieve = source.indexOf('const session = await retrieveStripeCheckoutSession(');
          const identity = source.indexOf('if (!sessionMatchesOrder(session, order))');
          const paid = source.indexOf('if (session.payment_status === "paid" || session.status === "complete")');
          const unsafe = source.indexOf('if (!checkoutSafety.safe)');
          const expire = source.indexOf('await expireStripeCheckoutSession({');
          if ([retrieve, identity, paid, unsafe, expire].some((value) => value < 0) || !(retrieve < identity && identity < paid && paid < unsafe && unsafe < expire)) {
            throw new Error('Checkout resume must verify identity and paid state before session revocation');
          }
          NODE

      - name: Refund webhook-race regression guard
        run: |
          set -euo pipefail
          grep -Fq 'await prisma.refund.upsert({' src/app/api/admin/refunds/route.ts
          grep -Fq 'where: { providerRefundId: stripeRefund.id }' src/app/api/admin/refunds/route.ts
          grep -Fq 'STRIPE_REFUND_PAYMENT_INTENT_MISMATCH' src/app/api/admin/refunds/route.ts
          grep -Fq 'STRIPE_REFUND_AMOUNT_MISMATCH' src/app/api/admin/refunds/route.ts
          grep -Fq 'STRIPE_REFUND_CURRENCY_MISMATCH' src/app/api/admin/refunds/route.ts
          grep -Fq 'stripeRefundStatus !== "pending"' src/app/api/admin/refunds/route.ts

      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Wrangler dry-run
        run: npm run cf:dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
