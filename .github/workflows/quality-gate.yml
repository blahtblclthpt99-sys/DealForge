name: DealForge Quality Gate

on:
  push:
    branches:
      - "migration/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-not-for-production-00000000000000000000000000000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create ephemeral CI database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Lint
        run: npm run lint

      - name: Catalog health tooling
        run: npm run catalog:health

      - name: Build
        run: npm run build

      - name: Production route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/dealforge-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dealforge-next.log
              exit 1
            fi
            sleep 1
          done

          check_status() {
            local expected="$1"
            local path="$2"
            local actual
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:3000${path}")
            if [ "$actual" != "$expected" ]; then
              echo "Expected ${expected} for ${path}, got ${actual}"
              cat /tmp/dealforge-next.log
              exit 1
            fi
          }

          check_status 200 /
          check_status 200 /categories
          check_status 200 /deals
          check_status 200 /search
          check_status 200 /login
          check_status 200 /register
          check_status 400 '/api/img?u=https%3A%2F%2Fexample.com%2Fimage.jpg'
          check_status 404 /definitely-not-a-real-route

          unsigned_code=$(curl --silent --output /tmp/maintenance-unsigned.json --write-out '%{http_code}' --request POST http://localhost:3000/api/internal/maintenance)
          echo "unsigned maintenance -> $unsigned_code"
          if [ "$unsigned_code" != "401" ]; then
            cat /tmp/maintenance-unsigned.json
            cat /tmp/dealforge-next.log
            exit 1
          fi

          timestamp=$(date +%s%3N)
          signature=$(python - "$timestamp" <<'PY'
          import hashlib
          import hmac
          import os
          import sys

          timestamp = sys.argv[1]
          secret = os.environ["AUTH_SECRET"].encode()
          message = f"dealforge-maintenance:{timestamp}".encode()
          print(hmac.new(secret, message, hashlib.sha256).hexdigest())
          PY
          )
          signed_code=$(curl --silent --output /tmp/maintenance-signed.json --write-out '%{http_code}' --request POST \
            --header "x-dealforge-maintenance-timestamp: $timestamp" \
            --header "x-dealforge-maintenance-signature: $signature" \
            http://localhost:3000/api/internal/maintenance)
          echo "signed maintenance -> $signed_code"
          if [ "$signed_code" != "200" ]; then
            cat /tmp/maintenance-signed.json
            cat /tmp/dealforge-next.log
            exit 1
          fi
          grep -q '"ok":true' /tmp/maintenance-signed.json

      - name: Dependency audit
        run: npm audit --audit-level=high
