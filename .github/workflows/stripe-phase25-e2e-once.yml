name: Stripe Phase 2.5 E2E Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-phase25-e2e-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  checkout-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CERT_EMAIL: phase25-final-v2-20260823-2027@example.com
      CHECKOUT_KEY: phase25-final-v2-20260823-2027
    steps:
      - uses: actions/checkout@v4

      - name: Create and classify DealForge checkout session
        id: create
        continue-on-error: true
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=stripe-phase25-checkout-create -f description='Calling live DealForge checkout API'
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o checkout.json -w '%{http_code}' \
            -X POST 'https://www.deal-forge.sale/api/checkout' \
            -H 'content-type: application/json' \
            --data "{\"checkoutKey\":\"${CHECKOUT_KEY}\",\"email\":\"${CERT_EMAIL}\",\"items\":[{\"productId\":\"cert_test_75c_20260822_v2\",\"quantity\":1}]}")
          error=$(node -e "const j=require('./checkout.json');process.stdout.write(String(j.error||''))")
          safe=$(printf '%s' "${error:-none}" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-40)
          state=failure; [[ "$code" == 201 ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="stripe-phase25-http-${code}" -f description="Checkout HTTP ${code}"
          if [[ -n "$error" ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="stripe-phase25-error-${safe}" -f description="Checkout error ${error}"
          fi
          node -e "const j=require('./checkout.json'); if(!j.checkoutUrl||!j.orderNumber) throw new Error(j.error||'checkout response invalid'); console.log('ORDER '+j.orderNumber)"
          [[ "$code" == 201 ]]
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=stripe-phase25-checkout-create -f description='Live DealForge checkout session created'

      - name: Stop if checkout creation failed
        if: steps.create.outcome != 'success'
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=stripe-phase25-checkout-create -f description='Live DealForge checkout API failed'
          exit 1

      - name: Install browser only after checkout exists
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=stripe-phase25-setup -f description='Installing browser after checkout creation'
          npm ci --no-fund --no-audit
          npx playwright install chromium
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=stripe-phase25-setup -f description='Chromium ready'

      - name: Complete Stripe-hosted 75-cent test payment
        id: pay
        continue-on-error: true
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=stripe-phase25-payment -f description='Submitting Stripe test card'
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const checkout = JSON.parse(fs.readFileSync('checkout.json','utf8'));
          async function fill(page, selectors, value) {
            for (const frame of page.frames()) for (const selector of selectors) {
              try {
                const el=frame.locator(selector).first();
                if(await el.count()&&await el.isVisible()){await el.fill(value,{timeout:3000});return true;}
              } catch {}
            }
            return false;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            let stage='open_stripe';
            try {
              await page.goto(checkout.checkoutUrl,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(3000);
              stage='card_entry';
              for(const frame of page.frames()) {
                try { const cardChoice=frame.getByText(/^Card$/i).first(); if(await cardChoice.count()&&await cardChoice.isVisible()) await cardChoice.click({timeout:2000}); } catch {}
              }
              const card=await fill(page,['input[name="cardNumber"]','input[autocomplete="cc-number"]','input[aria-label*="Card number" i]'],'4242424242424242');
              const exp=await fill(page,['input[name="cardExpiry"]','input[autocomplete="cc-exp"]','input[aria-label*="expiration" i]'],'1230');
              const cvc=await fill(page,['input[name="cardCvc"]','input[autocomplete="cc-csc"]','input[aria-label*="CVC" i]'],'123');
              await fill(page,['input[name="billingName"]','input[autocomplete="cc-name"]','input[autocomplete="name"]'],'DealForge Certification');
              await fill(page,['input[name="billingPostalCode"]','input[autocomplete="postal-code"]'],'73160');
              if(!card||!exp||!cvc) throw new Error(`card_fields card=${card} exp=${exp} cvc=${cvc}`);
              stage='submit';
              let clicked=false;
              for(const frame of page.frames()) {
                for(const button of [frame.getByRole('button',{name:/Pay/i}).last(),frame.locator('button[type="submit"]').last()]) {
                  try { if(await button.count()&&await button.isVisible()){await button.click({timeout:5000});clicked=true;break;} } catch {}
                }
                if(clicked) break;
              }
              if(!clicked) throw new Error('pay_button_missing');
              stage='redirect';
              await page.waitForURL(/deal-forge\.sale/,{timeout:90000});
              fs.writeFileSync('payment-result.txt','PASS|redirect');
            } catch(e) {
              const m=e instanceof Error?e.message:String(e);
              fs.writeFileSync('payment-result.txt',`FAIL|${stage}|${m}`);
              await page.screenshot({path:'stripe-phase25-failure.png',fullPage:true}).catch(()=>{});
              process.exitCode=1;
            } finally { await browser.close(); }
          })();
          NODE

      - name: Report payment result
        if: always() && steps.create.outcome == 'success'
        run: |
          result=$(cat payment-result.txt 2>/dev/null || echo 'FAIL|runner|no result')
          state=failure; [[ "$result" == PASS* ]] && state=success
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context=stripe-phase25-payment -f description="${result:0:130}"
          [[ "$state" == success ]]

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-phase25-e2e-failure
          path: |
            checkout.json
            payment-result.txt
            stripe-phase25-failure.png
          if-no-files-found: ignore
