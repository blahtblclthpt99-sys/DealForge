name: DealForge Custom Domain Diagnostics

on:
  push:
    branches:
      - migration/cloudflare-workers
    paths:
      - .github/workflows/custom-domain-diagnostics.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/custom-domain-diagnostics.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and HTTP response
        shell: bash
        run: |
          set +e
          for host in deal-forge.sale www.deal-forge.sale; do
            echo "===== $host DNS ====="
            getent ahosts "$host" || true
            command -v dig >/dev/null && {
              echo "A records:"
              dig +short A "$host"
              echo "AAAA records:"
              dig +short AAAA "$host"
              echo "CNAME:"
              dig +short CNAME "$host"
              echo "NS:"
              dig +short NS deal-forge.sale
            }

            echo "===== $host HTTPS ====="
            curl --silent --show-error --max-time 20 --max-redirs 0 \
              --dump-header "/tmp/${host}.headers" \
              --output "/tmp/${host}.body" \
              --write-out 'status=%{http_code}\nremote_ip=%{remote_ip}\nssl_verify=%{ssl_verify_result}\n' \
              "https://$host/" || true
            echo "--- headers ---"
            cat "/tmp/${host}.headers" || true
            echo "--- body preview ---"
            head -c 1500 "/tmp/${host}.body" || true
            echo
          done

      - name: Inspect registry and registrar
        shell: bash
        run: |
          set +e
          curl --silent --show-error --max-time 30 \
            -H 'Accept: application/rdap+json' \
            'https://rdap.identitydigital.services/rdap/domain/deal-forge.sale' \
            -o /tmp/rdap.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/rdap.json')
          if not p.exists() or not p.read_text().strip():
              print('RDAP unavailable')
              raise SystemExit(0)
          data = json.loads(p.read_text())
          print('domain:', data.get('ldhName'))
          print('status:', ', '.join(data.get('status', [])))
          print('nameservers:', ', '.join(ns.get('ldhName','') for ns in data.get('nameservers', [])))
          for entity in data.get('entities', []):
              if 'registrar' not in entity.get('roles', []):
                  continue
              name = None
              vc = entity.get('vcardArray') or []
              if len(vc) > 1:
                  for row in vc[1]:
                      if row and row[0] == 'fn':
                          name = row[3]
                          break
              print('registrar:', name or entity.get('handle'))
              print('registrar_handle:', entity.get('handle'))
              for link in entity.get('links', []):
                  if link.get('rel') == 'about':
                      print('registrar_url:', link.get('href'))
          for event in data.get('events', []):
              if event.get('eventAction') in {'registration','expiration','last changed'}:
                  print(event.get('eventAction') + ':', event.get('eventDate'))
          PY
