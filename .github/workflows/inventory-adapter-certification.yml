name: Inventory Adapter Certification

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dealforge-cloudflare-production
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      DEALFORGE_BASE_URL: https://www.deal-forge.sale
      INVENTORY_ADAPTER_CERT_ID: dealforge-phase3-cert-v1
      INVENTORY_ADAPTER_CERT_SOURCE: certification:phase3

    steps:
      - name: Mark certification pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=inventory-adapter-certification \
            -f description='Signed inventory adapter certification in progress'

      - name: Validate certification credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "::error::${name} missing"; exit 1; }
            echo "::add-mask::$value"
          done

      - name: Require exact certification revision to be deployed
        shell: bash
        run: |
          set -euo pipefail
          deploy=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
            --jq '[.statuses[] | select(.context=="cloudflare-production-deploy")][0].state // "missing"')
          echo "exact certification revision deployment state: ${deploy}"
          if [[ "$deploy" != 'success' ]]; then
            echo '::error::Refusing adapter certification because this exact revision is not proven live on Cloudflare.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify production adapter schema contract
        run: npx tsx scripts/check-inventory-adapter-schema.ts

      - name: Prove adapters are disabled before certification
        shell: bash
        run: |
          set -euo pipefail
          base="$DEALFORGE_BASE_URL"
          ready=0

          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/adapter-preflight-body -w '%{http_code}' \
              -X POST "$base/api/internal/inventory-adapter-certification" \
              -H 'content-type: application/json' \
              --data-binary '{"action":"certify"}' || true)
            error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/adapter-preflight-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "certification preflight attempt ${attempt}: HTTP ${code} (${error})"

            if [[ "$code" == '503' && "$error" == 'ADAPTER_AUTH_NOT_CONFIGURED' ]]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" != '1' ]]; then
            echo '::error::Certification requires adapters to be disabled before a temporary credential is provisioned.'
            exit 1
          fi

      - name: Refuse to overwrite an existing adapter secret
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name dealforge --format json > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          if (!Array.isArray(list)) throw new Error('Unexpected Cloudflare secret-list response');
          if (list.some((entry) => entry?.name === 'INVENTORY_ADAPTER_SECRETS_JSON')) {
            throw new Error('INVENTORY_ADAPTER_SECRETS_JSON already exists; refusing certification overwrite');
          }
          NODE

      - name: Generate and provision one-time adapter credential
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          cert_secret=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
          echo "::add-mask::$cert_secret"
          printf 'INVENTORY_ADAPTER_CERT_SECRET=%s\n' "$cert_secret" >> "$GITHUB_ENV"
          printf 'CERT_CLEANUP_ARMED=1\n' >> "$GITHUB_ENV"

          cert_map=$(CERT_SECRET="$cert_secret" node <<'NODE'
          const secret = process.env.CERT_SECRET;
          process.stdout.write(JSON.stringify({
            'dealforge-phase3-cert-v1': {
              secret,
              sourceKeys: ['certification:phase3'],
            },
          }));
          NODE
          )
          echo "::add-mask::$cert_map"
          printf '%s' "$cert_map" | npx wrangler secret put INVENTORY_ADAPTER_SECRETS_JSON --name dealforge

      - name: Certify signed request and durable replay rejection
        run: node scripts/certify-inventory-adapter.mjs

      - name: Remove one-time adapter credential with deployed-version semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CERT_CLEANUP_ARMED:-0}" == '1' ]] || exit 0
          printf '{"INVENTORY_ADAPTER_SECRETS_JSON":null}\n' | npx wrangler secret bulk --name dealforge

      - name: Prove adapters returned to disabled state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CERT_CLEANUP_ARMED:-0}" == '1' ]] || exit 0
          base="$DEALFORGE_BASE_URL"
          disabled=0

          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/adapter-postflight-body -w '%{http_code}' \
              -X POST "$base/api/internal/inventory-adapter-certification" \
              -H 'content-type: application/json' \
              --data-binary '{"action":"certify"}' || true)
            error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/adapter-postflight-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "certification postflight attempt ${attempt}: HTTP ${code} (${error})"

            if [[ "$code" == '503' && "$error" == 'ADAPTER_AUTH_NOT_CONFIGURED' ]]; then
              disabled=1
              break
            fi
            sleep 2
          done

          if [[ "$disabled" != '1' ]]; then
            echo '::error::Adapter credential was not proven removed after certification.'
            exit 1
          fi

      - name: Mark certification successful
        if: success()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=inventory-adapter-certification \
            -f description='Signed adapter auth, replay defense, and cleanup certified'

      - name: Mark certification failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=inventory-adapter-certification \
            -f description='Adapter certification failed; inspect cleanup and postflight evidence'
