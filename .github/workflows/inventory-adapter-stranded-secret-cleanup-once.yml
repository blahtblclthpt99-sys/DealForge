name: Inventory Adapter Stranded Secret Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-adapter-stranded-secret-cleanup-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      DEALFORGE_BASE_URL: https://www.deal-forge.sale

    steps:
      - name: Mark stranded-secret cleanup pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=inventory-adapter-secret-cleanup \
            -f description='Waiting for Cloudflare mutators before adapter-secret cleanup'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "::error::${name} missing"; exit 1; }
            echo "::add-mask::$value"
          done

      - name: Wait for exact-revision deploy and Stripe secret sync
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            deploy=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[] | select(.context=="cloudflare-production-deploy")][0].state // "missing"')
            stripe=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[] | select(.context=="cloudflare-stripe-secret-sync")][0].state // "missing"')
            echo "cloudflare mutators attempt ${attempt}: deploy=${deploy} stripe=${stripe}"

            if [[ "$deploy" == 'failure' || "$deploy" == 'error' || "$stripe" == 'failure' || "$stripe" == 'error' ]]; then
              echo '::error::A required Cloudflare mutator failed; refusing cleanup against an unsettled Worker version.'
              exit 1
            fi
            if [[ "$deploy" == 'success' && "$stripe" == 'success' ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "$ready" != '1' ]]; then
            echo '::error::Cloudflare mutators did not reach a settled successful state.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Remove only the known stranded certification binding
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name dealforge --format json > /tmp/worker-secrets-before.json
          present=$(node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/worker-secrets-before.json', 'utf8'));
          if (!Array.isArray(list)) throw new Error('Unexpected Cloudflare secret-list response');
          process.stdout.write(list.some((entry) => entry?.name === 'INVENTORY_ADAPTER_SECRETS_JSON') ? '1' : '0');
          NODE
          )

          if [[ "$present" == '1' ]]; then
            echo 'Removing stranded INVENTORY_ADAPTER_SECRETS_JSON certification binding.'
            printf '{"INVENTORY_ADAPTER_SECRETS_JSON":null}\n' | npx wrangler secret bulk --name dealforge
          else
            echo 'Adapter secret is already absent; cleanup is idempotently satisfied.'
          fi

      - name: Prove secret absence and disabled adapter state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name dealforge --format json > /tmp/worker-secrets-after.json
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/worker-secrets-after.json', 'utf8'));
          if (!Array.isArray(list)) throw new Error('Unexpected Cloudflare secret-list response');
          if (list.some((entry) => entry?.name === 'INVENTORY_ADAPTER_SECRETS_JSON')) {
            throw new Error('INVENTORY_ADAPTER_SECRETS_JSON still exists after cleanup');
          }
          NODE

          disabled=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/adapter-disabled-body -w '%{http_code}' \
              -X POST "$DEALFORGE_BASE_URL/api/internal/inventory-adapter-certification" \
              -H 'content-type: application/json' \
              --data-binary '{"action":"certify"}' || true)
            error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/adapter-disabled-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "adapter-disabled proof attempt ${attempt}: HTTP ${code} (${error})"
            if [[ "$code" == '503' && "$error" == 'ADAPTER_AUTH_NOT_CONFIGURED' ]]; then
              disabled=1
              break
            fi
            sleep 2
          done

          if [[ "$disabled" != '1' ]]; then
            echo '::error::Adapter machine authentication was not proven disabled after cleanup.'
            exit 1
          fi

      - name: Mark stranded-secret cleanup successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=inventory-adapter-secret-cleanup \
            -f description='Ephemeral adapter binding removed; machine adapters disabled'

      - name: Mark stranded-secret cleanup failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=inventory-adapter-secret-cleanup \
            -f description='Adapter secret cleanup failed; machine adapter state requires review'
