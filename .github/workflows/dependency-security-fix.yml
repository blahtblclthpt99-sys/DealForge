name: Dependency Security Fix

on:
  push:
    branches: [feature/product-engine-safe-intake]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-engine-safe-intake
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install next@15.5.23 --save-exact
      - run: npm audit fix --omit=dev
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit patched dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch production dependency advisories"
            git push origin HEAD:feature/product-engine-safe-intake
          fi
