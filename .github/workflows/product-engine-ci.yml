name: Product Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/product-engine-safe-intake]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealforge
          POSTGRES_PASSWORD: dealforge
          POSTGRES_DB: dealforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealforge -d dealforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dealforge:dealforge@localhost:5432/dealforge_ci?schema=public
      PGPASSWORD: dealforge
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      PRODUCT_ENGINE_OWNER_EMAIL: owner@example.test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Prisma schemas
        run: npm run prisma:validate
      - name: Test clean PostgreSQL migration chain
        run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
      - name: Reset database for existing-install upgrade test
        run: psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Recreate baseline DealForge database
        run: psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 -f prisma/migrations/20260822000000_dealforge_baseline/migration.sql
      - name: Baseline existing database safely
        run: npx prisma migrate resolve --applied 20260822000000_dealforge_baseline --schema=prisma/schema.postgres.prisma
      - name: Apply all post-baseline migrations over existing database
        run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
      - name: Verify upgraded schema is usable after migration
        run: npx prisma db push --schema=prisma/schema.postgres.prisma --skip-generate

      - name: Reset database for audited production-shape migration test
        run: psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Recreate audited legacy production shape without Prisma ledger
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20260822000000_dealforge_baseline
            20260822102000_product_engine_safe_intake
            20260822152000_stripe_financial_gate
            20260824232000_supplier_persistence_v1
            20260825015500_order_item_supplier_snapshot
            20260825021000_procurement_intent_journal_v1
            20260825053000_refund_financial_reconciliation_v1
            20260825120000_customer_savings_fund_phase_a
            20260825143000_production_schema_reconciliation_v1
            20260825163500_inventory_adapter_nonce_v1
          )
          for migration in "${migrations[@]}"; do
            echo "Applying audited legacy schema object set: ${migration}"
            psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 \
              -f "prisma/migrations/${migration}/migration.sql"
          done

          psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public."InventoryObservation"') IS NOT NULL
              OR to_regclass('public."InventoryRecheckJob"') IS NOT NULL
              OR to_regclass('public."InventoryAdapterRateWindow"') IS NOT NULL
              OR to_regclass('public."OrderDestination"') IS NOT NULL THEN
              RAISE EXCEPTION 'Audited legacy shape unexpectedly contains a pending migration object';
            END IF;
            IF to_regclass('public."InventoryAdapterNonce"') IS NULL THEN
              RAISE EXCEPTION 'Audited legacy shape is missing the already-present nonce table';
            END IF;
          END $$;
          SQL

      - name: Selectively baseline only migrations already materialized in audited production shape
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20260822000000_dealforge_baseline
            20260822102000_product_engine_safe_intake
            20260822152000_stripe_financial_gate
            20260824232000_supplier_persistence_v1
            20260825015500_order_item_supplier_snapshot
            20260825021000_procurement_intent_journal_v1
            20260825053000_refund_financial_reconciliation_v1
            20260825120000_customer_savings_fund_phase_a
            20260825143000_production_schema_reconciliation_v1
            20260825163500_inventory_adapter_nonce_v1
          )
          for migration in "${migrations[@]}"; do
            npx prisma migrate resolve --applied "$migration" --schema=prisma/schema.postgres.prisma
          done
      - name: Fill selective migration gaps in audited production shape
        run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
      - name: Verify selective production-shape migration result
        shell: bash
        run: |
          set -euo pipefail
          npx prisma migrate status --schema=prisma/schema.postgres.prisma
          psql -h localhost -U dealforge -d dealforge_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public."InventoryObservation"') IS NULL
              OR to_regclass('public."InventoryRecheckJob"') IS NULL
              OR to_regclass('public."InventoryAdapterNonce"') IS NULL
              OR to_regclass('public."InventoryAdapterRateWindow"') IS NULL
              OR to_regclass('public."OrderDestination"') IS NULL THEN
              RAISE EXCEPTION 'Selective production migration reconciliation did not reach current schema';
            END IF;
          END $$;
          SQL

      - name: Prepare isolated application test database
        env:
          DATABASE_URL: file:./ci-test.db
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma --force-reset --skip-generate
      - name: Complete test suite
        env:
          DATABASE_URL: file:./ci-test.db
        run: npm test
      - name: Product Engine tests explicitly
        env:
          DATABASE_URL: file:./ci-test.db
        run: npm run test:product-engine
      - name: Production build
        run: npm run build
      - name: Release gate satisfied
        run: |
          echo "All required release checks completed explicitly in this job."
          git diff --exit-code
