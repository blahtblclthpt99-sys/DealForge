name: Cloudflare Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dealforge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment in progress'

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::CLOUDFLARE_API_TOKEN missing'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Deploy exact main revision
        run: npm run cf:deploy

      - name: Mark deployment successful
        if: success()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment succeeded'

      - name: Mark deployment failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment failed'
