name: Cloudflare Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dealforge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-production-deploy -f description='Cloudflare production deployment in progress'

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::CLOUDFLARE_API_TOKEN missing'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }

      - name: Mark credentials valid
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-credentials -f description='Cloudflare deployment credentials present'

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Mark build pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-deploy-build -f description='Cloudflare Worker build in progress'

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Mark build successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-build -f description='Cloudflare Worker build succeeded'

      - name: Mark deploy pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-deploy-publish -f description='Publishing Worker to Cloudflare'

      - name: Deploy exact main revision
        run: npm run cf:deploy

      - name: Mark smoke test pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-live-smoke -f description='Testing deployed DealForge routes'

      - name: Smoke-test live DealForge routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.deal-forge.sale'

          health_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/health-body -w '%{http_code}' "$base/api/health")
          echo "health HTTP $health_code"
          cat /tmp/health-body
          echo
          [[ "$health_code" == '200' ]] || { echo '::error::Live /api/health is not healthy'; exit 1; }

          cert_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/cert-body -w '%{http_code}' "$base/stripe-certification")
          echo "stripe-certification HTTP $cert_code"
          [[ "$cert_code" == '200' ]] || { cat /tmp/cert-body; echo; echo '::error::Live /stripe-certification route is unavailable'; exit 1; }

          webhook_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/webhook-body -w '%{http_code}' -X POST "$base/api/stripe/webhook" -H 'content-type: application/json' -H 'stripe-signature: t=1,v1=deadbeef' --data '{}')
          echo "webhook bogus-signature HTTP $webhook_code"
          cat /tmp/webhook-body
          echo
          if [[ "$webhook_code" == '503' ]]; then
            echo '::error::Live webhook route exists but STRIPE_WEBHOOK_SECRET is not configured in Cloudflare runtime'
            exit 1
          fi
          [[ "$webhook_code" == '400' ]] || { echo '::error::Live webhook route did not reject invalid Stripe signature as expected'; exit 1; }

      - name: Mark smoke test successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-live-smoke -f description='Live DealForge routes and webhook secret verified'

      - name: Mark deploy successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-publish -f description='Cloudflare Worker publish succeeded'
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-production-deploy -f description='Cloudflare production deployment succeeded'

      - name: Mark deployment failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-production-deploy -f description='Cloudflare production deployment failed'
