name: Cloudflare Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dealforge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      STRIPE_WEBHOOK_SECRET_LEGACY: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-production-deploy -f description='Cloudflare production deployment in progress'

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::CLOUDFLARE_API_TOKEN missing'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          [[ "${STRIPE_WEBHOOK_SECRET_TEST:-}" == whsec_* ]] || { echo '::error::STRIPE_WEBHOOK_SECRET_TEST missing or invalid'; exit 1; }

      - name: Mark credentials valid
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-credentials -f description='Cloudflare deployment credentials present'

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate Stripe webhook secret sources
        shell: bash
        run: |
          set -euo pipefail
          for name in STRIPE_WEBHOOK_SECRET_LIVE STRIPE_WEBHOOK_SECRET_TEST STRIPE_WEBHOOK_SECRET_LEGACY; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            echo "::add-mask::$value"
            [[ "$value" == whsec_* ]] || { echo "::error::${name} must start with whsec_."; exit 1; }
          done

      - name: Mark build pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-deploy-build -f description='Cloudflare Worker build in progress'

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Mark build successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-build -f description='Cloudflare Worker build succeeded'

      - name: Mark deploy pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-deploy-publish -f description='Publishing Worker to Cloudflare'

      - name: Deploy exact main revision with webhook secret
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('fs');
          const names = ['STRIPE_WEBHOOK_SECRET_LIVE', 'STRIPE_WEBHOOK_SECRET_TEST', 'STRIPE_WEBHOOK_SECRET_LEGACY'];
          const mapped = {
            STRIPE_WEBHOOK_SECRET_LIVE: 'STRIPE_WEBHOOK_SECRET_LIVE',
            STRIPE_WEBHOOK_SECRET_TEST: 'STRIPE_WEBHOOK_SECRET_TEST',
            STRIPE_WEBHOOK_SECRET_LEGACY: 'STRIPE_WEBHOOK_SECRET',
          };
          const secrets = {};
          for (const source of names) {
            const value = (process.env[source] || '').trim();
            if (value) secrets[mapped[source]] = value;
          }
          if (!(secrets.STRIPE_WEBHOOK_SECRET_TEST || '').startsWith('whsec_')) {
            throw new Error('STRIPE_WEBHOOK_SECRET_TEST missing or invalid');
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          npx wrangler deploy --secrets-file "$secrets_file"

      - name: Mark smoke test pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=cloudflare-live-smoke -f description='Testing deployed DealForge routes'

      - name: Smoke-test live DealForge routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.deal-forge.sale'

          health_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/health-body -w '%{http_code}' "$base/api/health")
          echo "health HTTP $health_code"
          cat /tmp/health-body
          echo

          db_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.database||'unknown'))}catch{process.stdout.write('invalid_response')}")
          case "$db_state" in
            ok)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-db-ok -f description='Cloudflare Worker connected to Neon'
              ;;
            not_configured)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-db-not-configured -f description='DATABASE_URL missing or invalid in Cloudflare runtime'
              ;;
            unreachable)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-db-unreachable -f description='DATABASE_URL present but one database transport failed'
              ;;
            *)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-db-health-invalid -f description='Health response did not expose a valid database state'
              ;;
          esac

          neon_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.neonHttp||'unknown'))}catch{process.stdout.write('unknown')}")
          neon_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.neonHttpError||'none'))}catch{process.stdout.write('unknown')}")
          prisma_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.prismaAdapter||'unknown'))}catch{process.stdout.write('unknown')}")
          prisma_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.prismaAdapterError||'none'))}catch{process.stdout.write('unknown')}")
          tx_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.prismaTransaction||'unknown'))}catch{process.stdout.write('unknown')}")
          tx_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.diagnostics?.prismaTransactionError||'none'))}catch{process.stdout.write('unknown')}")

          if [[ "$neon_state" == 'ok' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-neon-http -f description='Direct Neon serverless HTTP query succeeded'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-neon-http -f description="Direct Neon HTTP failed (${neon_error})"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="cloudflare-neon-${neon_error}" -f description='Sanitized Neon HTTP failure class'
          fi

          if [[ "$prisma_state" == 'ok' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-prisma-adapter -f description='Prisma Neon adapter query succeeded'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-prisma-adapter -f description="Prisma Neon adapter failed (${prisma_error})"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="cloudflare-prisma-${prisma_error}" -f description='Sanitized Prisma adapter failure class'
          fi

          if [[ "$tx_state" == 'ok' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-prisma-transaction -f description='Prisma interactive transaction succeeded'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-prisma-transaction -f description="Prisma transaction failed (${tx_error})"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="cloudflare-prisma-tx-${tx_error}" -f description='Sanitized Prisma transaction failure class'
          fi

          if [[ "$health_code" == '200' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-live-health -f description='Live /api/health returned HTTP 200'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-live-health -f description="Live /api/health returned HTTP ${health_code}"
            exit 1
          fi

          cert_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/cert-body -w '%{http_code}' "$base/stripe-certification")
          echo "stripe-certification HTTP $cert_code"
          if [[ "$cert_code" == '200' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-live-cert-route -f description='Live /stripe-certification returned HTTP 200'
          else
            cat /tmp/cert-body
            echo
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-live-cert-route -f description="Live /stripe-certification returned HTTP ${cert_code}"
            exit 1
          fi

          webhook_code='000'
          webhook_error='unknown'
          for attempt in 1 2 3 4 5 6 7 8; do
            webhook_code=$(curl -sS -o /tmp/webhook-body -w '%{http_code}' -X POST "$base/api/stripe/webhook" -H 'content-type: application/json' -H 'stripe-signature: t=1,v1=deadbeef' --data '{}' || true)
            webhook_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/webhook-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "webhook bogus-signature attempt ${attempt}: HTTP $webhook_code (${webhook_error})"
            [[ "$webhook_code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]] && break
            sleep 3
          done

          if [[ "$webhook_code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-live-webhook-secret -f description='Live webhook runtime secret is configured'
          elif [[ "$webhook_code" == '503' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-live-webhook-secret -f description='Stripe runtime secret unavailable after propagation window'
            exit 1
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-live-webhook-secret -f description="Webhook probe returned ${webhook_code}/${webhook_error} after propagation window"
            exit 1
          fi

      - name: Mark smoke test successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-live-smoke -f description='Live DealForge routes and webhook runtime configuration verified'

      - name: Mark deploy successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-deploy-publish -f description='Cloudflare Worker publish succeeded'
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=cloudflare-production-deploy -f description='Cloudflare production deployment succeeded'

      - name: Mark deployment failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=cloudflare-production-deploy -f description='Cloudflare production deployment failed'
