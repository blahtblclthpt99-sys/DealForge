name: Cloudflare Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dealforge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      STRIPE_WEBHOOK_SECRET_LEGACY: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment in progress'

      - name: Validate complete production secret contract
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            DATABASE_URL
            AUTH_SECRET
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET_TEST
          )

          for name in "${required[@]}"; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "::error::${name} missing"; exit 1; }
            echo "::add-mask::$value"
          done

          [[ "$STRIPE_SECRET_KEY" == sk_test_* || "$STRIPE_SECRET_KEY" == sk_live_* ]] || {
            echo '::error::STRIPE_SECRET_KEY has an invalid mode prefix'; exit 1;
          }
          [[ "$STRIPE_WEBHOOK_SECRET_TEST" == whsec_* ]] || {
            echo '::error::STRIPE_WEBHOOK_SECRET_TEST missing or invalid'; exit 1;
          }

          for name in STRIPE_WEBHOOK_SECRET_LIVE STRIPE_WEBHOOK_SECRET_LEGACY; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            echo "::add-mask::$value"
            [[ "$value" == whsec_* ]] || { echo "::error::${name} must start with whsec_."; exit 1; }
          done

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=cloudflare-deploy-credentials \
            -f description='Complete Cloudflare runtime secret contract present'

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Mark build pending
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=cloudflare-deploy-build \
            -f description='Cloudflare Worker build in progress'

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Mark build successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=cloudflare-deploy-build \
            -f description='Cloudflare Worker build succeeded'

      - name: Deploy exact main revision with complete runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=cloudflare-deploy-publish \
            -f description='Publishing Worker to Cloudflare'

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"

          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('fs');

          const sourceToBinding = {
            DATABASE_URL: 'DATABASE_URL',
            AUTH_SECRET: 'AUTH_SECRET',
            STRIPE_SECRET_KEY: 'STRIPE_SECRET_KEY',
            STRIPE_WEBHOOK_SECRET_LIVE: 'STRIPE_WEBHOOK_SECRET_LIVE',
            STRIPE_WEBHOOK_SECRET_TEST: 'STRIPE_WEBHOOK_SECRET_TEST',
            STRIPE_WEBHOOK_SECRET_LEGACY: 'STRIPE_WEBHOOK_SECRET',
          };

          const secrets = {};
          for (const [source, binding] of Object.entries(sourceToBinding)) {
            const value = (process.env[source] || '').trim();
            if (value) secrets[binding] = value;
          }

          for (const name of ['DATABASE_URL', 'AUTH_SECRET', 'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET_TEST']) {
            if (!secrets[name]) throw new Error(`${name} missing from deploy secret contract`);
          }

          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE

          npx wrangler deploy --secrets-file "$secrets_file"

      - name: Smoke-test live DealForge routes
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=cloudflare-live-smoke \
            -f description='Testing deployed DealForge routes'

          base='https://www.deal-forge.sale'

          health_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/health-body -w '%{http_code}' "$base/api/health")
          echo "health HTTP $health_code"
          cat /tmp/health-body
          echo

          db_state=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/health-body','utf8'));process.stdout.write(String(j.database||'unknown'))}catch{process.stdout.write('invalid_response')}")
          if [[ "$health_code" == '200' && "$db_state" == 'ok' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=cloudflare-live-health \
              -f description='Live health and database checks passed'
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=cloudflare-db-ok \
              -f description='Cloudflare Worker connected to Neon'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context=cloudflare-live-health \
              -f description="Health/database check failed (${health_code}/${db_state})"
            exit 1
          fi

          cert_code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/cert-body -w '%{http_code}' "$base/stripe-certification")
          echo "stripe-certification HTTP $cert_code"
          if [[ "$cert_code" == '200' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=cloudflare-live-cert-route \
              -f description='Live /stripe-certification returned HTTP 200'
          else
            cat /tmp/cert-body
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context=cloudflare-live-cert-route \
              -f description="Live /stripe-certification returned HTTP ${cert_code}"
            exit 1
          fi

          webhook_code='000'
          webhook_error='unknown'
          for attempt in 1 2 3 4 5 6 7 8; do
            webhook_code=$(curl -sS -o /tmp/webhook-body -w '%{http_code}' \
              -X POST "$base/api/stripe/webhook" \
              -H 'content-type: application/json' \
              -H 'stripe-signature: t=1,v1=deadbeef' \
              --data '{}' || true)
            webhook_error=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/webhook-body','utf8'));process.stdout.write(String(j.error||'none'))}catch{process.stdout.write('invalid_response')}")
            echo "webhook bogus-signature attempt ${attempt}: HTTP $webhook_code (${webhook_error})"
            [[ "$webhook_code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]] && break
            sleep 3
          done

          if [[ "$webhook_code" == '400' && "$webhook_error" == 'INVALID_STRIPE_SIGNATURE' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=cloudflare-live-webhook-secret \
              -f description='Live webhook runtime secret is configured'
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context=cloudflare-live-webhook-secret \
              -f description="Webhook probe returned ${webhook_code}/${webhook_error}"
            exit 1
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=cloudflare-live-smoke \
            -f description='Live DealForge routes and webhook runtime configuration verified'

      - name: Mark deploy successful
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=cloudflare-deploy-publish \
            -f description='Cloudflare Worker publish succeeded'
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment succeeded'

      - name: Mark deployment failed
        if: failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=cloudflare-production-deploy \
            -f description='Cloudflare production deployment failed'
