name: Phase 2.5 Diagnostic Production Probe

on:
  pull_request:
    branches:
      - migration/cloudflare-workers
    paths:
      - .github/workflows/phase25-diagnostic-production-probe.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: https://www.deal-forge.sale
      EXPECTED_SHA: 442a093455a264ed7901f1d1de5828ef149a42a6
    steps:
      - name: Wait for exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 42); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/build.json --write-out '%{http_code}' "$PRODUCTION_URL/api/build" || echo 000)
            sha=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/build.json').read_text()).get('sha',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt http=$code sha=$sha expected=$EXPECTED_SHA"
            if [[ "$code" == "200" && "$sha" == "$EXPECTED_SHA" ]]; then
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == "1" ]]

      - name: Verify webhook signature gate remains active
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 \
            --request POST \
            --header 'content-type: application/json' \
            --header 'stripe-signature: t=1,v1=deadbeef' \
            --data '{}' \
            --output /tmp/webhook.json \
            --write-out '%{http_code}' \
            "$PRODUCTION_URL/api/stripe/webhook" || echo 000)
          body=$(cat /tmp/webhook.json 2>/dev/null || true)
          echo "webhook_http=$code"
          [[ "$code" == "400" ]]
          [[ "$body" == *'INVALID_STRIPE_SIGNATURE'* ]]
