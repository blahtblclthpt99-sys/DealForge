name: Cloudflare Lockfile Refresh

on:
  push:
    branches:
      - migration/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_WORKERS: "1"
      DATABASE_URL: postgresql://dealforge:ci-only@db.invalid/dealforge?sslmode=require
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-workers

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh package lock
        run: npm install --no-fund --no-audit

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Cloudflare candidate dependencies"
          git push origin HEAD:migration/cloudflare-workers
